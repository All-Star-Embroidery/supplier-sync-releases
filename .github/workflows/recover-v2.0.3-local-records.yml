name: Recover Supplier Sync v2.0.3 Local Records

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-v2.0.3-local-records.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decode staged truncated archive
        shell: bash
        run: |
          set -euo pipefail
          cat .release-staging/2.0.3/part-*.txt | base64 --decode > /tmp/v2.0.3-truncated.zip

      - name: Recover local ZIP records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import binascii
          import os
          import struct
          import zlib
          from pathlib import Path

          raw = Path('/tmp/v2.0.3-truncated.zip').read_bytes()
          out = Path('/tmp/recovered-v203')
          out.mkdir(parents=True, exist_ok=True)
          report = []
          pos = 0
          recovered = 0
          failed = False

          while pos + 30 <= len(raw):
              if raw[pos:pos+4] != b'PK\x03\x04':
                  report.append(f'stop_offset={pos} next={raw[pos:pos+16].hex()}')
                  break
              try:
                  sig, ver, flag, method, mtime, mdate, crc, csize, usize, nlen, xlen = struct.unpack_from('<4s5H3L2H', raw, pos)
              except struct.error as exc:
                  report.append(f'header_error offset={pos} error={exc}')
                  failed = True
                  break
              name_start = pos + 30
              data_start = name_start + nlen + xlen
              if data_start > len(raw):
                  report.append(f'truncated_header offset={pos}')
                  failed = True
                  break
              name = raw[name_start:name_start+nlen].decode('utf-8', 'replace')

              descriptor_len = 0
              if flag & 0x08 and csize == 0:
                  if method == 8:
                      d = zlib.decompressobj(-15)
                      try:
                          content = d.decompress(raw[data_start:])
                          content += d.flush()
                      except zlib.error as exc:
                          report.append(f'truncated_deflate name={name} offset={data_start} error={exc}')
                          failed = True
                          break
                      if not d.eof:
                          report.append(f'truncated_deflate name={name} offset={data_start} eof=0')
                          failed = True
                          break
                      consumed = len(raw[data_start:]) - len(d.unused_data)
                      cdata = raw[data_start:data_start+consumed]
                      next_pos = data_start + consumed
                      if raw[next_pos:next_pos+4] == b'PK\x07\x08':
                          descriptor_len = 16
                          _, crc, csize, usize = struct.unpack_from('<4sLLL', raw, next_pos)
                      else:
                          descriptor_len = 12
                          if next_pos + 12 > len(raw):
                              report.append(f'truncated_descriptor name={name}')
                              failed = True
                              break
                          crc, csize, usize = struct.unpack_from('<LLL', raw, next_pos)
                      pos_after = next_pos + descriptor_len
                  else:
                      report.append(f'unsupported_descriptor name={name} method={method}')
                      failed = True
                      break
              else:
                  end = data_start + csize
                  if end > len(raw):
                      report.append(f'truncated_data name={name} need_end={end} raw_bytes={len(raw)}')
                      failed = True
                      break
                  cdata = raw[data_start:end]
                  if method == 0:
                      content = cdata
                  elif method == 8:
                      try:
                          content = zlib.decompress(cdata, -15)
                      except zlib.error as exc:
                          report.append(f'deflate_error name={name} error={exc}')
                          failed = True
                          break
                  else:
                      report.append(f'unsupported_method name={name} method={method}')
                      failed = True
                      break
                  pos_after = end

              calc_crc = binascii.crc32(content) & 0xffffffff
              crc_ok = (crc == 0 or calc_crc == crc)
              size_ok = (usize == 0 or len(content) == usize)
              report.append(f'recovered name={name} method={method} compressed={len(cdata)} size={len(content)} crc_ok={int(crc_ok)} size_ok={int(size_ok)}')
              if not crc_ok or not size_ok:
                  report.append(f'validation_failed name={name} expected_crc={crc:08x} actual_crc={calc_crc:08x} expected_size={usize}')
                  failed = True
                  break

              safe = Path(name)
              if safe.is_absolute() or '..' in safe.parts:
                  report.append(f'unsafe_path name={name}')
                  failed = True
                  break
              dest = out / safe
              if name.endswith('/'):
                  dest.mkdir(parents=True, exist_ok=True)
              else:
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(content)
                  recovered += 1
              pos = pos_after

          report.append(f'raw_bytes={len(raw)}')
          report.append(f'final_offset={pos}')
          report.append(f'files_recovered={recovered}')
          report.append(f'failed={int(failed)}')
          (out / 'RECOVERY-REPORT.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')

          root = out / 'all-star-supplier-sync'
          plugin = root / 'all-star-supplier-sync.php'
          if plugin.exists():
              text = plugin.read_text(encoding='utf-8', errors='replace')
              print('main_plugin_recovered=yes')
              print('version_203=' + ('yes' if 'Version: 2.0.3' in text else 'no'))
          else:
              print('main_plugin_recovered=no')
          print('\n'.join(report[-8:]))
          PY

      - name: Publish recovered source branch
        env:
          BRANCH: recovery/v2.0.3-local-records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan "$BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          if [[ -d /tmp/recovered-v203/all-star-supplier-sync ]]; then
            cp -a /tmp/recovered-v203/all-star-supplier-sync/. .
          fi
          cp /tmp/recovered-v203/RECOVERY-REPORT.txt .
          git add -A
          git commit -m 'Recover Supplier Sync v2.0.3 source from local ZIP records'
          git push --force origin "$BRANCH"
