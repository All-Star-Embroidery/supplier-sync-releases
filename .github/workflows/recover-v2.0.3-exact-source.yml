name: Recover Supplier Sync v2.0.3 Exact Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-v2.0.3-exact-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download exact v2.0.3 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v2.0.3 --pattern 'all-star-supplier-sync-2.0.3.zip' --output /tmp/all-star-supplier-sync-2.0.3.zip
          echo '39844901328845e81c5442adefe2b542c04081655a6b90fc229535f6586c5af4  /tmp/all-star-supplier-sync-2.0.3.zip' | sha256sum -c -
          rm -rf /tmp/recovered-v203
          mkdir -p /tmp/recovered-v203
          unzip -q /tmp/all-star-supplier-sync-2.0.3.zip -d /tmp/recovered-v203
          test -f /tmp/recovered-v203/all-star-supplier-sync/all-star-supplier-sync.php

      - name: Publish exact source branch
        env:
          BRANCH: recovery/v2.0.3-exact-source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan "$BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/recovered-v203/all-star-supplier-sync/. .
          git add -A
          git commit -m 'Recover exact Supplier Sync v2.0.3 source from release asset'
          git push --force origin "$BRANCH"
