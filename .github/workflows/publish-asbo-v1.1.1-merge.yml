name: Publish ASBO v1.1.1 on merge

on:
  push:
    branches: [main]
    paths:
      - 'asbo/.trigger-v1.1.1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Build package
        run: python3 asbo/build-v1.1.1.py

      - name: Publish files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asbo/all-star-bulk-order-block-1.1.1.zip asbo/latest.json asbo/RELEASE-1.1.1.md
          git commit -m 'release: ASBO v1.1.1 mobile progression UX'
          git push

      - name: Cleanup temporary ASBO build tooling
        run: |
          git pull --ff-only
          git rm -f asbo/build-v1.1.1.py asbo/.trigger-v1.1.1 .github/workflows/build-asbo-v1.1.1.yml .github/workflows/trigger-asbo-v1.1.1.yml .github/workflows/publish-asbo-v1.1.1-merge.yml
          git commit -m 'maintenance: remove ASBO v1.1.1 build tooling'
          git push
