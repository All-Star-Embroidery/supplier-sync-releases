name: Publish Supplier Sync Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 2.0.3"
        required: true
        type: string
  push:
    paths:
      - 'all-star-supplier-sync-*.zip'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Resolve package and version
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            ZIP="all-star-supplier-sync-${VERSION}.zip"
          else
            ZIP="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^all-star-supplier-sync-[0-9].*\.zip$' | tail -1 || true)"
            if [[ -z "$ZIP" ]]; then
              ZIP="$(find . -maxdepth 1 -type f -name 'all-star-supplier-sync-*.zip' -printf '%f\n' | sort -V | tail -1)"
            fi
            VERSION="${ZIP#all-star-supplier-sync-}"
            VERSION="${VERSION%.zip}"
          fi
          test -f "$ZIP"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Validate WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "${{ steps.pkg.outputs.zip }}" >/dev/null
          unzip -l "${{ steps.pkg.outputs.zip }}" | grep -q 'all-star-supplier-sync/all-star-supplier-sync.php'

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.pkg.outputs.version }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "All Star Supplier Sync $TAG" \
              --generate-notes
          fi
