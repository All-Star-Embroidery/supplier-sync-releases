name: Build Supplier Sync v2.0.24

on:
  push:
    paths:
      - '.github/workflows/build-v2.0.24.yml'
      - '.release-tools/build_v2024.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact v2.0.23 source
        uses: actions/checkout@v6
        with:
          ref: recovery/v2.0.23-exact-source
          path: source

      - name: Checkout release repository
        uses: actions/checkout@v6
        with:
          ref: main
          path: release
          fetch-depth: 0

      - name: Apply v2.0.24 patch
        run: python3 release/.release-tools/build_v2024.py

      - name: Validate source
        run: |
          find source -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          from pathlib import Path
          bridge=Path('source/includes/class-asss-bridge.php').read_text()
          sanmar=Path('source/includes/class-asss-sanmar.php').read_text()
          importer=Path('source/includes/class-asss-importer.php').read_text()
          checks = {
            'bridge': [
              '/bridge/media/sanmar/requests', '/bridge/media/sanmar/result',
              'receive_sanmar_image_result', 'sanmar-normalized', 'wp_generate_attachment_metadata',
            ],
            'sanmar': [
              'queue_storefront_image_request', 'pending_storefront_image_requests',
              'sanmar-square-v1', 'asss_sanmar_storefront_image_queue_v1',
            ],
            'importer': [
              'migrate_sanmar_storefront_images_v2024', 'queue_storefront_image_request',
              "['sanmar','sanmar-normalized','ss','momentec','supplier']",
            ],
          }
          for needle in checks['bridge']: assert needle in bridge, needle
          for needle in checks['sanmar']: assert needle in sanmar, needle
          for needle in checks['importer']: assert needle in importer, needle
          assert "Version: 2.0.24" in Path('source/all-star-supplier-sync.php').read_text()
          assert "Stable tag: 2.0.24" in Path('source/readme.txt').read_text()
          print('v2.0.24 GitHub image-normalization invariants passed')
          PY

      - name: Save exact v2.0.24 source branch
        working-directory: release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B recovery/v2.0.24-exact-source
          git rm -rf . >/dev/null 2>&1 || true
          rsync -a --exclude='.git' ../source/ ./
          git add -A
          git commit -m 'release: exact v2.0.24 source'
          git push --force origin recovery/v2.0.24-exact-source
          git checkout main

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf package && mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' --exclude='.github' source/ package/all-star-supplier-sync/
          (cd package && zip -qr ../all-star-supplier-sync-2.0.24.zip all-star-supplier-sync)
          SHA=$(sha256sum all-star-supplier-sync-2.0.24.zip | awk '{print $1}')
          cd release
          git checkout main
          git pull --ff-only
          cat > latest.json <<EOF
          {
            "version": "2.0.24",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.24/all-star-supplier-sync-2.0.24.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.24",
            "name": "All Star Supplier Sync v2.0.24"
          }
          EOF
          git add latest.json
          git commit -m 'release: point updater to v2.0.24'
          git push
          gh release create v2.0.24 ../all-star-supplier-sync-2.0.24.zip --title 'All Star Supplier Sync v2.0.24' --notes "GitHub-side SanMar storefront image normalization. WordPress queues source images; GitHub crops/re-centers them into square storefront derivatives; inventory sync remains image-free. SHA-256: $SHA"
          echo "RELEASE_SHA256=$SHA"

      - name: Cleanup temporary release tooling
        if: success()
        working-directory: release
        run: |
          git pull --ff-only
          git rm .github/workflows/build-v2.0.24.yml .release-tools/build_v2024.py
          git commit -m 'maintenance: remove temporary v2.0.24 build tooling'
          git push
