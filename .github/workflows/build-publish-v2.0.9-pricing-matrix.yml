name: Build and Publish Supplier Sync v2.0.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-v2.0.9-pricing-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: release

      - name: Checkout exact v2.0.8 source
        uses: actions/checkout@v6
        with:
          ref: recovery/v2.0.8-exact-source
          path: source

      - name: Apply v2.0.9 bulk pricing patch
        shell: bash
        run: |
          set -euo pipefail
          python3 release/release-tools/v209_patch.py source

      - name: Validate PHP and pricing ladder
        shell: bash
        run: |
          set -euo pipefail
          find source -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q 'Version: 2.0.9' source/all-star-supplier-sync.php
          grep -q "define('ASSS_VERSION', '2.0.9')" source/all-star-supplier-sync.php
          grep -q "6=>\$main_price" source/includes/class-asss-importer.php
          grep -q "9=>\$main_price-1.0" source/includes/class-asss-importer.php
          grep -q "12=>\$main_price-2.0" source/includes/class-asss-importer.php
          grep -q "24=>\$main_price-3.0" source/includes/class-asss-importer.php
          grep -q "48=>\$main_price-4.0" source/includes/class-asss-importer.php
          grep -q "96=>\$main_price-6.0" source/includes/class-asss-importer.php
          grep -q "144=>\$main_price-7.0" source/includes/class-asss-importer.php
          grep -q "288=>\$main_price-9.0" source/includes/class-asss-importer.php
          ! grep -q "20=>\$main_price-2.0, 50=>\$main_price-4.0, 100=>\$main_price-6.0" source/includes/class-asss-importer.php
          grep -q 'migrate_managed_asbo_pricing_v209' source/includes/class-asss-importer.php
          grep -q 'asss_managed_asbo_pricing_schema' source/all-star-supplier-sync.php

      - name: Validate merchant pricing protection
        shell: bash
        run: |
          set -euo pipefail
          grep -q "managed_asbo_matrix_can_update" source/includes/class-asss-importer.php
          grep -q "pricing ownership changed to merchant" source/includes/class-asss-importer.php
          grep -q "_asss_asbo_pricing_last_value" source/includes/class-asss-importer.php
          grep -q "_asss_asbo_pricing_basis_main" source/includes/class-asss-importer.php
          grep -q "Patch|'" source/includes/class-asss-importer.php
          grep -q "price + 3.0" source/includes/class-asss-importer.php

      - name: Validate credential boundary remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -q 'ASSS_MOMENTEC_USERNAME\|ASSS_MOMENTEC_PASSWORD' source
          ! grep -R -q 'MOMENTEC_USERNAME\|MOMENTEC_PASSWORD' source
          ! grep -R -q 'name="momentec_username"\|name="momentec_password"\|name="momentec_api_key"' source

      - name: Build and validate WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' source/ package/all-star-supplier-sync/
          cd package
          zip -qr ../release/all-star-supplier-sync-2.0.9.zip all-star-supplier-sync
          cd ../release
          unzip -t all-star-supplier-sync-2.0.9.zip >/dev/null
          unzip -p all-star-supplier-sync-2.0.9.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.9'
          sha256sum all-star-supplier-sync-2.0.9.zip

      - name: Prepare release metadata
        working-directory: release
        shell: bash
        run: |
          cat > latest.json <<'JSON'
          {
            "version": "2.0.9",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.9/all-star-supplier-sync-2.0.9.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.9",
            "name": "All Star Supplier Sync v2.0.9"
          }
          JSON
          cat > RELEASE-2.0.9.md <<'MD'
          # All Star Supplier Sync v2.0.9

          New All Star bulk hat pricing ladder.

          Supplier Sync-managed ASBO pricing matrices now use fixed per-item discounts based on total quantity:

          - **6+**: base price
          - **9+**: $1.00 off per item
          - **12+**: $2.00 off per item
          - **24+**: $3.00 off per item
          - **48+**: $4.00 off per item
          - **96+**: $6.00 off per item
          - **144+**: $7.00 off per item
          - **288+**: $9.00 off per item

          Patch pricing keeps its existing $3.00 per-item surcharge above Embroidery while receiving the same quantity discounts.

          Existing Supplier Sync-managed matrices are migrated automatically using their saved base selling price. Matrices that were manually edited by the merchant remain untouched and are permanently handed back to merchant ownership.
          MD

      - name: Publish exact v2.0.9 source branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release source: All Star Supplier Sync v2.0.9'
          git push --force origin HEAD:recovery/v2.0.9-exact-source

      - name: Commit v2.0.9 package and metadata
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-supplier-sync-2.0.9.zip latest.json RELEASE-2.0.9.md
          git commit -m 'release: All Star Supplier Sync v2.0.9'
          git push origin main

      - name: Publish GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.9 >/dev/null 2>&1; then
            gh release upload v2.0.9 all-star-supplier-sync-2.0.9.zip --clobber
            gh release edit v2.0.9 --title 'All Star Supplier Sync v2.0.9' --notes-file RELEASE-2.0.9.md
          else
            gh release create v2.0.9 all-star-supplier-sync-2.0.9.zip --target main --title 'All Star Supplier Sync v2.0.9' --notes-file RELEASE-2.0.9.md
          fi
