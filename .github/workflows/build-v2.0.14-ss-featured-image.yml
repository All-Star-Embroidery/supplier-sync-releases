# retry: explicit validation
name: Build Supplier Sync v2.0.14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v2.0.14-ss-featured-image.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: recovery/v2.0.13-exact-source
          fetch-depth: 0
          path: source

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          path: release

      - name: Patch source
        run: python3 release/.release-tools/v2014_patch.py source

      - name: Validate source
        shell: bash
        run: |
          set -e
          find source -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          from pathlib import Path
          main=Path('source/all-star-supplier-sync.php').read_text()
          p=Path('source/includes/class-asss-importer.php').read_text()
          checks={
            'version header':'Version: 2.0.14' in main,
            'version constant':"define('ASSS_VERSION', '2.0.14')" in main,
            'selector helper':'private function ss_parent_featured_url' in p,
            'black ranking':"'black'=>0" in p,
            'navy ranking':"'navy'=>100" in p,
            'charcoal ranking':"'charcoal'=>200" in p,
            'gallery media types':'gallery_types' in p,
            'lifestyle exclusion':'No on-model/lifestyle fallback' in p,
            'manual image protection':'$manual_featured' in p,
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Validation failed: '+', '.join(failed))
          print('SS_STOREFRONT_IMAGE_RANKING=PASS')
          PY

      - name: Save exact source
        working-directory: source
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-supplier-sync.php includes/class-asss-importer.php
          git commit -m 'Release source: All Star Supplier Sync v2.0.14'
          git push origin HEAD:recovery/v2.0.14-exact-source

      - name: Build and publish package
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          rm -rf ../package
          mkdir -p ../package/all-star-supplier-sync
          rsync -a --exclude='.git' ../source/ ../package/all-star-supplier-sync/
          (cd ../package && zip -qr ../release/all-star-supplier-sync-2.0.14.zip all-star-supplier-sync)
          unzip -t all-star-supplier-sync-2.0.14.zip >/dev/null
          unzip -p all-star-supplier-sync-2.0.14.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.14'
          SHA=$(sha256sum all-star-supplier-sync-2.0.14.zip | awk '{print $1}')
          printf '%s\n' '{' '  "version": "2.0.14",' '  "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.14/all-star-supplier-sync-2.0.14.zip",' '  "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.14",' '  "name": "All Star Supplier Sync v2.0.14"' '}' > latest.json
          printf '%s\n' '# All Star Supplier Sync v2.0.14' '' 'S&S storefront featured-image ranking improvements.' '' '- Preserves merchant-selected featured images.' '- Prefers clean front product photography in Black, Navy, Charcoal, Graphite, Gray/Grey, then White.' '- Falls back to any clean front shot, then the S&S style thumbnail, other non-model product angles, and finally the generic product image.' '- On-model/lifestyle photography remains gallery-only and is never automatically featured.' '- Existing Supplier Sync-managed S&S images are re-evaluated on import/refresh/Quick Repair.' > RELEASE-2.0.14.md
          git add all-star-supplier-sync-2.0.14.zip latest.json RELEASE-2.0.14.md
          git commit -m 'release: All Star Supplier Sync v2.0.14'
          git push origin main
          if gh release view v2.0.14 >/dev/null 2>&1; then
            gh release upload v2.0.14 all-star-supplier-sync-2.0.14.zip --clobber
            gh release edit v2.0.14 --title 'All Star Supplier Sync v2.0.14' --notes-file RELEASE-2.0.14.md
          else
            gh release create v2.0.14 all-star-supplier-sync-2.0.14.zip --target main --title 'All Star Supplier Sync v2.0.14' --notes-file RELEASE-2.0.14.md
          fi
          echo RELEASE_SHA256=$SHA
