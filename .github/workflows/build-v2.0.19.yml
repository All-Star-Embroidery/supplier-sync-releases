name: Build Supplier Sync v2.0.19

on:
  push:
    paths:
      - '.github/workflows/build-v2.0.19.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact v2.0.18 source
        uses: actions/checkout@v6
        with:
          ref: recovery/v2.0.18-exact-source
          path: src
          fetch-depth: 0

      - name: Checkout release repository
        uses: actions/checkout@v6
        with:
          ref: main
          path: rel
          fetch-depth: 0

      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 rel/.release-tools/patch-v2.0.19.py

      - name: Validate PHP and v2.0.19 invariants
        shell: bash
        run: |
          set -euo pipefail
          find src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          cat /tmp/php-lint.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/includes/class-asss-importer.php').read_text()
          checks={
            'TN helper':'is_ss_tn_reference_attachment',
            'product-aware cleanup':'invalid_storefront_attachment_for_product',
            'v2019 migration':'migrate_ss_tn_reference_media_v2019',
            'style token TN check':"str_ends_with($key, $style_key . 'tn')",
            'local attachment inspection':'get_attached_file($attachment_id)',
          }
          missing=[k for k,v in checks.items() if v not in s]
          if missing: raise SystemExit('Missing invariants: '+', '.join(missing))
          main=Path('src/all-star-supplier-sync.php').read_text()
          if "define('ASSS_VERSION', '2.0.19');" not in main: raise SystemExit('Version constant not bumped')
          print('v2.0.19 source invariants passed')
          PY

      - name: Save exact v2.0.19 source branch
        shell: bash
        run: |
          set -euo pipefail
          cd src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C recovery/v2.0.19-exact-source
          git add -A
          git commit -m 'release: exact v2.0.19 plugin source'
          git push --force-with-lease origin HEAD:refs/heads/recovery/v2.0.19-exact-source

      - name: Build package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' src/ package/all-star-supplier-sync/
          rm -rf package/all-star-supplier-sync/.github package/all-star-supplier-sync/.release-tools
          (cd package && zip -qr ../rel/all-star-supplier-sync-2.0.19.zip all-star-supplier-sync)
          unzip -t rel/all-star-supplier-sync-2.0.19.zip >/dev/null
          SHA=$(sha256sum rel/all-star-supplier-sync-2.0.19.zip | awk '{print $1}')
          cat > rel/latest.json <<EOF
          {
            "version": "2.0.19",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.19/all-star-supplier-sync-2.0.19.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.19",
            "name": "All Star Supplier Sync v2.0.19"
          }
          EOF
          cd rel
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-supplier-sync-2.0.19.zip latest.json
          git commit -m 'release: publish Supplier Sync v2.0.19'
          git push origin main
          gh release create v2.0.19 all-star-supplier-sync-2.0.19.zip \
            --target main \
            --title 'All Star Supplier Sync v2.0.19' \
            --notes "Refines S&S placeholder cleanup for style-level TN assets such as CCRC0TN and FF180APTN. Cleanup now checks original supplier URLs and local/optimized attachment filenames so WebP derivatives that lost Supplier Sync metadata are removed from customer-facing product and variation galleries. Ordinary merchant media remains preserved. Files are not deleted from the Media Library. SHA-256: ${SHA}"
          echo "SHA256=${SHA}"

      - name: Remove temporary release tooling
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd rel
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/build-v2.0.19.yml .release-tools/patch-v2.0.19.py
          rmdir .release-tools 2>/dev/null || true
          git commit -m 'cleanup: remove v2.0.19 release tooling'
          git push origin main
