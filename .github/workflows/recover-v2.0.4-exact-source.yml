name: Recover Supplier Sync v2.0.4 Exact Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-v2.0.4-exact-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download exact v2.0.4 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asss-v204-source /tmp/asss-v204.zip
          mkdir -p /tmp/asss-v204-source
          gh release download v2.0.4 --pattern 'all-star-supplier-sync-2.0.4.zip' --output /tmp/asss-v204.zip
          echo 'f4521c161e13975adb5a3aa7cc6c4b195ff4a831ef462a0da433c7a67ed7a470  /tmp/asss-v204.zip' | sha256sum -c -
          unzip -q /tmp/asss-v204.zip -d /tmp/asss-v204-source
          test -f /tmp/asss-v204-source/all-star-supplier-sync/all-star-supplier-sync.php

      - name: Publish exact source branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='recovery/v2.0.4-exact-source'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan "$BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/asss-v204-source/all-star-supplier-sync/. .
          git add -A
          git commit -m 'Recover exact Supplier Sync v2.0.4 source from release asset'
          git push --force origin "$BRANCH"
