name: Build Supplier Sync v2.0.33 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-supplier-sync-2.0.33-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact v2.0.32 source
        uses: actions/checkout@v6
        with:
          ref: v2.0.32
          fetch-depth: 0

      - name: Apply v2.0.33 patch
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/scripts/build-v2.0.33.py > /tmp/build-v2.0.33.py
          python3 /tmp/build-v2.0.33.py

      - name: Validate PHP and progress hooks
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          grep -q "Version: 2.0.33" all-star-supplier-sync.php
          grep -q "capture_progress" includes/class-asss-background-jobs.php
          grep -q "asss_import_progress" includes/class-asss-importer.php
          grep -q 'job.status==="stalled"' includes/class-asss-admin.php

      - name: Commit exact v2.0.33 source and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b supplier-sync-v2.0.33-source
          git add all-star-supplier-sync.php includes/class-asss-background-jobs.php includes/class-asss-importer.php includes/class-asss-admin.php
          git commit -m "Supplier Sync v2.0.33 real progress heartbeats"
          git tag -a v2.0.33 -m "Supplier Sync v2.0.33"
          git push origin supplier-sync-v2.0.33-source
          git push origin v2.0.33

      - name: Build and validate WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg/all-star-supplier-sync
          rsync -a --exclude='.git' --exclude='.github' --exclude='all-star-supplier-sync-*.zip' ./ /tmp/pkg/all-star-supplier-sync/
          cd /tmp/pkg
          zip -qr "$GITHUB_WORKSPACE/all-star-supplier-sync-2.0.33.zip" all-star-supplier-sync
          cd "$GITHUB_WORKSPACE"
          unzip -t all-star-supplier-sync-2.0.33.zip >/dev/null
          unzip -l all-star-supplier-sync-2.0.33.zip | grep -q 'all-star-supplier-sync/all-star-supplier-sync.php'
          sha256sum all-star-supplier-sync-2.0.33.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v2.0.33 all-star-supplier-sync-2.0.33.zip \
            --title "All Star Supplier Sync v2.0.33" \
            --notes "Real exact-variation progress heartbeats for SanMar, S&S, and Momentec background imports; determinate progress UI when totals are known; 4-minute no-heartbeat stall detection; no supplier matching, pricing, inventory, media, or ASBO behavior changes."
