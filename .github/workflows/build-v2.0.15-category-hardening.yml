name: Build Supplier Sync v2.0.15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v2.0.15-category-hardening.yml'
      - '.release-tools/v2015_patch.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact v2.0.14 source
        uses: actions/checkout@v5
        with:
          ref: recovery/v2.0.14-exact-source
          fetch-depth: 0
          path: source

      - name: Checkout release repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          path: release

      - name: Patch source
        run: python3 release/.release-tools/v2015_patch.py source

      - name: Validate PHP and category invariants
        shell: bash
        run: |
          set -euo pipefail
          find source -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          from pathlib import Path
          main=Path('source/all-star-supplier-sync.php').read_text()
          imp=Path('source/includes/class-asss-importer.php').read_text()
          mom=Path('source/includes/class-asss-momentec.php').read_text()
          checks={
            'version header':'Version: 2.0.15' in main,
            'version constant':"define('ASSS_VERSION', '2.0.15')" in main,
            'shared supplier category sync':'private function sync_supplier_categories' in imp,
            'hierarchy creation':'ensure_product_category_path' in imp and "'parent'=>$parent" in imp,
            'manual-category preservation':'$manual = $is_new ? []' in imp,
            'per-supplier category ownership':"'_asss_supplier_category_ids_' . $supplier" in imp,
            'S&S taxonomy owner':"$this->sync_taxonomies($product_id, $brand, $categories, $keywords, $is_new, 'ss');" in imp,
            'Momentec taxonomy owner':"$this->sync_taxonomies($product_id,$brand,$categories,'',$is_new,'momentec');" in imp,
            'legacy category migration':'migrate_supplier_categories_v2015' in imp,
            'Momentec catalog merge':'enrich_style_with_catalog' in mom and 'catalog_product(string $style)' in mom,
            'Momentec runtime category upgrade':'return $this->enrich_style_with_catalog($decoded,$style);' in mom,
            'no Momentec credentials': 'MOMENTEC_USERNAME' not in '\n'.join(p.read_text(errors='ignore') for p in Path('source').rglob('*') if p.is_file()),
          }
          failed=[name for name,ok in checks.items() if not ok]
          for name,ok in checks.items(): print(('PASS ' if ok else 'FAIL ')+name)
          if failed: raise SystemExit('Validation failed: '+', '.join(failed))
          PY

      - name: Save exact v2.0.15 source branch
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C recovery/v2.0.15-exact-source
          git add -A
          git commit -m 'release: All Star Supplier Sync v2.0.15 exact source'
          git push --force origin recovery/v2.0.15-exact-source

      - name: Build package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          rm -rf /tmp/asss-v2015
          mkdir -p /tmp/asss-v2015/all-star-supplier-sync
          rsync -a --exclude='.git' ../source/ /tmp/asss-v2015/all-star-supplier-sync/
          (cd /tmp/asss-v2015 && zip -qr "$GITHUB_WORKSPACE/release/all-star-supplier-sync-2.0.15.zip" all-star-supplier-sync)
          unzip -t all-star-supplier-sync-2.0.15.zip >/dev/null
          unzip -p all-star-supplier-sync-2.0.15.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.15'
          cat > latest.json <<'JSON'
          {
            "version": "2.0.15",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.15/all-star-supplier-sync-2.0.15.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.15",
            "name": "All Star Supplier Sync v2.0.15"
          }
          JSON
          git add all-star-supplier-sync-2.0.15.zip latest.json
          git commit -m 'release: publish All Star Supplier Sync v2.0.15'
          git push origin main
          SHA=$(sha256sum all-star-supplier-sync-2.0.15.zip | awk '{print $1}')
          gh release create v2.0.15 all-star-supplier-sync-2.0.15.zip \
            --repo rolejarczyk/ASE.SupplierSync-Releases \
            --target main \
            --title 'All Star Supplier Sync v2.0.15' \
            --notes "Supplier category hardening across SanMar, S&S Activewear, and Momentec. Categories are imported during product creation/link/refresh, category ownership is tracked per supplier, merchant categories are preserved, explicit hierarchy paths create real Woo parent/child terms, and Momentec v2 details inherit official catalog-feed categories. SHA-256: $SHA"

      - name: Remove temporary release tooling
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd release
          git pull --rebase origin main
          rm -f .github/workflows/build-v2.0.15-category-hardening.yml .release-tools/v2015_patch.py
          git add -A
          git commit -m 'ci: remove temporary v2.0.15 release tooling' || true
          git push origin main
