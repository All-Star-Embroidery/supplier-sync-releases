name: Publish Supplier Sync v2.0.29

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-supplier-sync-v2.0.29.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository with tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate exact v2.0.29 source
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/supplier-sync-v2.0.29"
          git worktree add "$WORK" v2.0.29
          cd "$WORK"
          php -l all-star-supplier-sync.php
          php -l includes/class-asss-asbo-title-sync.php
          find includes -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          grep -q "Version: 2.0.29" all-star-supplier-sync.php
          grep -q "define('ASSS_VERSION', '2.0.29');" all-star-supplier-sync.php
          grep -q "Stable tag: 2.0.29" readme.txt
          grep -q "_asbo_display_name" includes/class-asss-asbo-title-sync.php
          grep -q "Weekender Trucker Cap" includes/class-asss-asbo-title-sync.php

      - name: Build and validate WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/supplier-sync-v2.0.29"
          PKG="$RUNNER_TEMP/package"
          ZIP="$GITHUB_WORKSPACE/all-star-supplier-sync-2.0.29.zip"
          rm -rf "$PKG"
          mkdir -p "$PKG/all-star-supplier-sync"
          cd "$WORK"
          cp all-star-supplier-sync.php readme.txt MOMENTEC-API-GROUNDWORK.md V1-ARCHITECTURE.md V2-ARCHITECTURE.md "$PKG/all-star-supplier-sync/"
          cp -R includes "$PKG/all-star-supplier-sync/includes"
          cd "$PKG"
          zip -qr "$ZIP" all-star-supplier-sync
          unzip -t "$ZIP" >/dev/null
          unzip -l "$ZIP" | grep -q 'all-star-supplier-sync/all-star-supplier-sync.php'
          unzip -l "$ZIP" | grep -q 'all-star-supplier-sync/includes/class-asss-asbo-title-sync.php'
          sha256sum "$ZIP" | tee "$GITHUB_WORKSPACE/v2.0.29-sha256.txt"

      - name: Publish v2.0.29 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="all-star-supplier-sync-2.0.29.zip"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Supplier Sync v2.0.29

          - Completes the v2.0.28 customer-facing title work by synchronizing Supplier Sync-owned `_asbo_display_name` values with the managed WooCommerce product title.
          - Existing generic S&S Activewear and Momentec ASBO row names are repaired from the normalized local supplier caches.
          - Richardson 112 legacy names such as `Weekender Trucker Cap` and `Snapback Trucker Cap` are repaired to the canonical Richardson 112 title.
          - New supplier imports receive the corrected ASBO display name automatically after Supplier Sync title normalization.
          - Manual/custom ASBO display names are preserved when they no longer match Supplier Sync-managed or raw supplier names.
          - No changes to Woo pricing, supplier costs, ASBO pricing/cart calculations, inventory, exact variation matching, media, taxonomy, shipping weights, or GitHub Actions cadence.
          NOTES

          if gh release view v2.0.29 >/dev/null 2>&1; then
            gh release upload v2.0.29 "$ZIP" --clobber
            gh release edit v2.0.29 \
              --title "All Star Supplier Sync v2.0.29" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create v2.0.29 "$ZIP" \
              --title "All Star Supplier Sync v2.0.29" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
