name: Publish ASBO v1.1.1

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.title == 'BUILD ASBO v1.1.1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Build package
        run: python3 asbo/build-v1.1.1.py

      - name: Publish files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asbo/all-star-bulk-order-block-1.1.1.zip asbo/latest.json asbo/RELEASE-1.1.1.md
          git commit -m 'release: ASBO v1.1.1 mobile progression UX'
          git push

      - name: Cleanup temporary build tooling
        run: |
          git pull --ff-only
          git rm -f asbo/build-v1.1.1.py .github/workflows/build-asbo-v1.1.1.yml .github/workflows/trigger-asbo-v1.1.1.yml
          git commit -m 'maintenance: remove ASBO v1.1.1 build tooling'
          git push
