name: Build and Publish Supplier Sync v2.0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-v2.0.5-github-momentec.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: release

      - name: Checkout exact v2.0.4 plugin source
        uses: actions/checkout@v5
        with:
          ref: recovery/v2.0.4-exact-source
          path: source

      - name: Apply v2.0.5 patch
        run: python3 release/release-tools/build_v205.py source release

      - name: Validate source and secret boundary
        shell: bash
        run: |
          set -euo pipefail
          find source -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q 'Version: 2.0.5' source/all-star-supplier-sync.php
          grep -q "define('ASSS_VERSION', '2.0.5')" source/all-star-supplier-sync.php
          grep -q 'github-actions-secrets' source/includes/class-asss-momentec.php
          grep -q 'MOMENTEC_USERNAME' source/includes/class-asss-admin.php
          grep -q 'MOMENTEC_PASSWORD' source/includes/class-asss-admin.php
          ! grep -q 'name="momentec_username"' source/includes/class-asss-admin.php
          ! grep -q 'name="momentec_password"' source/includes/class-asss-admin.php
          ! grep -q 'name="momentec_api_key"' source/includes/class-asss-admin.php
          ! grep -q 'name="momentec_api_base"' source/includes/class-asss-admin.php
          ! grep -q 'name="momentec_account"' source/includes/class-asss-admin.php
          ! grep -q 'ASSS_MOMENTEC_USERNAME' source/includes/class-asss-momentec.php
          ! grep -q 'ASSS_MOMENTEC_PASSWORD' source/includes/class-asss-momentec.php

      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' source/ package/all-star-supplier-sync/
          cd package
          zip -qr ../release/all-star-supplier-sync-2.0.5.zip all-star-supplier-sync
          cd ../release
          unzip -t all-star-supplier-sync-2.0.5.zip >/dev/null
          unzip -p all-star-supplier-sync-2.0.5.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.5'

      - name: Commit v2.0.5 package and metadata
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-supplier-sync-2.0.5.zip latest.json RELEASE-2.0.5.md
          git commit -m 'release: All Star Supplier Sync v2.0.5'
          git push origin main

      - name: Publish GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.5 >/dev/null 2>&1; then
            gh release upload v2.0.5 all-star-supplier-sync-2.0.5.zip --clobber
            gh release edit v2.0.5 --title 'All Star Supplier Sync v2.0.5' --notes-file RELEASE-2.0.5.md
          else
            gh release create v2.0.5 all-star-supplier-sync-2.0.5.zip --target main --title 'All Star Supplier Sync v2.0.5' --notes-file RELEASE-2.0.5.md
          fi

# rerun after resilient source section matching
