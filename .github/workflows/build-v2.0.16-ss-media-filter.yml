name: Build Supplier Sync v2.0.16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v2.0.16-ss-media-filter.yml'
      - '.release-tools/v2016_ss_media_filter.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact v2.0.15 source
        uses: actions/checkout@v5
        with:
          ref: recovery/v2.0.15-exact-source
          fetch-depth: 0
          path: source

      - name: Checkout release repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          path: release

      - name: Patch source
        run: python3 release/.release-tools/v2016_ss_media_filter.py source

      - name: Validate PHP and media invariants
        shell: bash
        run: |
          set -euo pipefail
          find source -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          from pathlib import Path
          main=Path('source/all-star-supplier-sync.php').read_text()
          imp=Path('source/includes/class-asss-importer.php').read_text()
          readme=Path('source/readme.txt').read_text()
          checks={
            'version header':'Version: 2.0.16' in main,
            'version constant':"define('ASSS_VERSION', '2.0.16')" in main,
            'stable tag':'Stable tag: 2.0.16' in readme,
            'media classifier':'private function ss_classify_variant_media' in imp,
            'reference bucket':"_asss_ss_reference_media_urls" in imp,
            'unknown media reference-only':"else $reference[$url] = true;" in imp,
            'style asset excluded':"$allowed=['front','directside','side','back'];" in imp,
            'parent style fallback removed':'S&S style-level thumbnail.' not in imp,
            'parent generic fallback removed':'Generic style/product image only after clean product photography.' not in imp,
            'supplier panel cleanup':'$product->set_image_id(0);' in imp,
            'variation panel cleanup':'if (!$manual_primary) $v->set_image_id(0);' in imp,
            'manual gallery preserved':'array_merge($supplier_gallery, $manual_gallery)' in imp,
            'audit storefront only':"$classified_media = $this->ss_classify_variant_media($row);" in imp,
          }
          failed=[name for name,ok in checks.items() if not ok]
          for name,ok in checks.items(): print(('PASS ' if ok else 'FAIL ')+name)
          if failed: raise SystemExit('Validation failed: '+', '.join(failed))
          PY

      - name: Save exact v2.0.16 source branch
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C recovery/v2.0.16-exact-source
          git add -A
          git commit -m 'release: All Star Supplier Sync v2.0.16 exact source'
          git push --force origin recovery/v2.0.16-exact-source

      - name: Build package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          rm -rf /tmp/asss-v2016
          mkdir -p /tmp/asss-v2016/all-star-supplier-sync
          rsync -a --exclude='.git' ../source/ /tmp/asss-v2016/all-star-supplier-sync/
          (cd /tmp/asss-v2016 && zip -qr "$GITHUB_WORKSPACE/release/all-star-supplier-sync-2.0.16.zip" all-star-supplier-sync)
          unzip -t all-star-supplier-sync-2.0.16.zip >/dev/null
          unzip -p all-star-supplier-sync-2.0.16.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.16'
          cat > latest.json <<'JSON'
          {
            "version": "2.0.16",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.16/all-star-supplier-sync-2.0.16.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.16",
            "name": "All Star Supplier Sync v2.0.16"
          }
          JSON
          git add all-star-supplier-sync-2.0.16.zip latest.json
          git commit -m 'release: publish All Star Supplier Sync v2.0.16'
          git push origin main
          SHA=$(sha256sum all-star-supplier-sync-2.0.16.zip | awk '{print $1}')
          gh release create v2.0.16 all-star-supplier-sync-2.0.16.zip \
            --repo rolejarczyk/ASE.SupplierSync-Releases \
            --target main \
            --title 'All Star Supplier Sync v2.0.16' \
            --notes "S&S media hardening: storefront galleries now accept only verified product photography. Full color boards, swatch/reference sheets, generic style assets, and unknown S&S media types are retained as internal supplier reference metadata and excluded from WooCommerce featured/product/variation galleries. Quick Repair cleans existing Supplier Sync-owned reference graphics while preserving merchant-added media. SHA-256: $SHA"

      - name: Remove temporary release tooling
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd release
          git pull --rebase origin main
          rm -f .github/workflows/build-v2.0.16-ss-media-filter.yml .release-tools/v2016_ss_media_filter.py
          git add -A
          git commit -m 'ci: remove temporary v2.0.16 release tooling' || true
          git push origin main
