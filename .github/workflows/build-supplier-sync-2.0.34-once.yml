name: Build Supplier Sync v2.0.34 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-supplier-sync-2.0.34-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact v2.0.33 source
        uses: actions/checkout@v6
        with:
          ref: v2.0.33
          fetch-depth: 0

      - name: Apply v2.0.34 patch
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/scripts/build-v2.0.34.py > /tmp/build-v2.0.34.py
          python3 /tmp/build-v2.0.34.py

      - name: Validate PHP and showcase rules
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          grep -q "Version: 2.0.34" all-star-supplier-sync.php
          grep -q "apply_storefront_showcase_image" includes/class-asss-importer.php
          grep -q "manual-protected" includes/class-asss-importer.php
          grep -q "automatic-colorful" includes/class-asss-importer.php
          grep -q "migrate_storefront_showcase_images_v2034" includes/class-asss-importer.php

      - name: Commit exact v2.0.34 source and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b supplier-sync-v2.0.34-source
          git add all-star-supplier-sync.php includes/class-asss-importer.php
          git commit -m "Supplier Sync v2.0.34 storefront showcase colors"
          git tag -a v2.0.34 -m "Supplier Sync v2.0.34"
          git push origin supplier-sync-v2.0.34-source
          git push origin v2.0.34

      - name: Build and validate WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg/all-star-supplier-sync
          rsync -a --exclude='.git' --exclude='.github' --exclude='all-star-supplier-sync-*.zip' ./ /tmp/pkg/all-star-supplier-sync/
          cd /tmp/pkg
          zip -qr "$GITHUB_WORKSPACE/all-star-supplier-sync-2.0.34.zip" all-star-supplier-sync
          cd "$GITHUB_WORKSPACE"
          unzip -t all-star-supplier-sync-2.0.34.zip >/dev/null
          unzip -l all-star-supplier-sync-2.0.34.zip | grep -q 'all-star-supplier-sync/all-star-supplier-sync.php'
          sha256sum all-star-supplier-sync-2.0.34.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v2.0.34 all-star-supplier-sync-2.0.34.zip \
            --title "All Star Supplier Sync v2.0.34" \
            --notes "Stable storefront showcase colors for supplier-synced products. Picks a real variation image deterministically per product, prefers non-neutral colors when available, protects merchant-uploaded featured images, and incrementally repairs existing SanMar, S&S, and Momentec products. Variation images and supplier import behavior are unchanged."
