name: Build Supplier Sync v2.0.31 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-supplier-sync-2.0.31-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact v2.0.30 source
        uses: actions/checkout@v6
        with:
          ref: v2.0.30
          fetch-depth: 0

      - name: Patch admin progress feedback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          main = Path('all-star-supplier-sync.php')
          text = main.read_text(encoding='utf-8')
          if text.count('Version: 2.0.30') != 1 or text.count("define('ASSS_VERSION', '2.0.30');") != 1:
              raise SystemExit('Unexpected v2.0.30 version markers.')
          text = text.replace('Version: 2.0.30', 'Version: 2.0.31', 1)
          text = text.replace("define('ASSS_VERSION', '2.0.30');", "define('ASSS_VERSION', '2.0.31');", 1)
          main.write_text(text, encoding='utf-8')

          old = base64.b64decode('ICAgIHByaXZhdGUgZnVuY3Rpb24gd3JhcF9zdGFydCgkdGl0bGUpOiB2b2lkIHsKICAgICAgICBlY2hvICc8ZGl2IGNsYXNzPSJ3cmFwIj48aDE+JyAuIGVzY19odG1sKCR0aXRsZSkgLiAnPC9oMT4nOwogICAgfQoKICAgIHByaXZhdGUgZnVuY3Rpb24gd3JhcF9lbmQoKTogdm9pZCB7CiAgICAgICAgZWNobyAnPC9kaXY+JzsKICAgIH0K').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')
          admin = Path('includes/class-asss-admin.php')
          text = admin.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit('Could not locate admin wrap_start/wrap_end anchor exactly once.')
          text = text.replace(old, new, 1)
          admin.write_text(text, encoding='utf-8')
          PY

      - name: Validate PHP and progress controller
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Version: 2.0.31' all-star-supplier-sync.php
          grep -q "define('ASSS_VERSION', '2.0.31');" all-star-supplier-sync.php
          grep -q 'Supplier Sync is working' includes/class-asss-admin.php
          grep -q 'asss_import_ss_style' includes/class-asss-admin.php
          grep -q 'asss_sync_products' includes/class-asss-admin.php
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          cat /tmp/php-lint.txt

      - name: Commit exact v2.0.31 source and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c recovery/v2.0.31-exact-source
          git add all-star-supplier-sync.php includes/class-asss-admin.php
          git commit -m 'Supplier Sync v2.0.31: add admin progress feedback'
          git push origin HEAD:refs/heads/recovery/v2.0.31-exact-source
          git tag -a v2.0.31 -m 'All Star Supplier Sync v2.0.31'
          git push origin refs/tags/v2.0.31

      - name: Build and validate WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asss-package /tmp/all-star-supplier-sync-2.0.31.zip
          mkdir -p /tmp/asss-package/all-star-supplier-sync
          rsync -a ./ /tmp/asss-package/all-star-supplier-sync/ \
            --exclude='.git' --exclude='.github' --exclude='*.zip' --exclude='RELEASE-*.md' --exclude='.release-staging' --exclude='MOMENTEC-API-GROUNDWORK.md'
          (cd /tmp/asss-package && zip -qr /tmp/all-star-supplier-sync-2.0.31.zip all-star-supplier-sync)
          unzip -t /tmp/all-star-supplier-sync-2.0.31.zip >/dev/null
          unzip -l /tmp/all-star-supplier-sync-2.0.31.zip | grep -q 'all-star-supplier-sync/all-star-supplier-sync.php'
          unzip -p /tmp/all-star-supplier-sync-2.0.31.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.31'
          sha256sum /tmp/all-star-supplier-sync-2.0.31.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          cat > "$NOTES" <<'EOF'
          Supplier Sync v2.0.31

          - Adds visible progress feedback for long-running Supplier Sync admin actions so imports and repairs no longer appear frozen.
          - Covers SanMar, S&S Activewear, and Momentec create/import/link actions, Quick Repair, Product Sync / Repair, and direct inventory fallback.
          - Shows an honest indeterminate progress bar, current operation, elapsed time, and longer-running status messages rather than a fake completion percentage.
          - Prevents accidental duplicate submissions while an operation is running.
          - Preserves the submitted action even after its button is disabled, so existing POST handlers continue to work unchanged.
          - No changes to supplier data, pricing, inventory rules, variations, media, taxonomy, ASBO calculations, or GitHub Actions schedules.
          EOF
          gh release create v2.0.31 /tmp/all-star-supplier-sync-2.0.31.zip \
            --title 'All Star Supplier Sync v2.0.31' \
            --notes-file "$NOTES"
