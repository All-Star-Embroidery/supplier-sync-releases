name: Build Supplier Sync v2.0.13

on:
  push:
    branches:
      - v2.0.13-workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: recovery/v2.0.13-exact-source
          fetch-depth: 0
          path: source

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          path: release

      - name: Patch source
        run: |
          python3 source/v2013_patch.py source
          rm source/v2013_patch.py

      - name: Validate source
        run: |
          set -e
          find source -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q 'Version: 2.0.13' source/all-star-supplier-sync.php
          python3 -c "from pathlib import Path; p=Path('source/includes/class-asss-importer.php').read_text(); a=p.index('private function momentec_parent_featured_url'); b=p.index('/** Attach only one parent image',a); f=p[a:b]; assert f.index(\"images']['thumbnail\") < f.index('primary_image') < f.index(\"images']['product\"); assert \"row['gallery']\" not in f; a=p.index('private function sync_momentec_parent_media'); b=p.index('private function momentec_row_for_variation',a); assert 'set_image_id' not in p[a:b]"

      - name: Save exact source
        working-directory: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release source: All Star Supplier Sync v2.0.13'
          git push origin HEAD:recovery/v2.0.13-exact-source

      - name: Build package
        run: |
          set -e
          rm -rf package
          mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' source/ package/all-star-supplier-sync/
          cd package
          zip -qr ../release/all-star-supplier-sync-2.0.13.zip all-star-supplier-sync
          cd ../release
          unzip -t all-star-supplier-sync-2.0.13.zip >/dev/null
          unzip -p all-star-supplier-sync-2.0.13.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.13'
          printf '%s\n' '{' '  "version": "2.0.13",' '  "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.13/all-star-supplier-sync-2.0.13.zip",' '  "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.13",' '  "name": "All Star Supplier Sync v2.0.13"' '}' > latest.json
          printf '%s\n' '# All Star Supplier Sync v2.0.13' '' 'Momentec featured-image selection update.' '' '- Featured image priority: images.thumbnail, then first selected variation primary_image, then images.product.' '- Gallery/lifestyle images are never promoted to featured image by the background media job.' '- If no preferred image exists, the featured image is left for manual selection.' '- Merchant-selected featured images remain protected.' '- Existing Supplier Sync-managed Momentec featured images are re-evaluated on refresh/Quick Repair.' > RELEASE-2.0.13.md
          sha256sum all-star-supplier-sync-2.0.13.zip

      - name: Publish package to main
        working-directory: release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-supplier-sync-2.0.13.zip latest.json RELEASE-2.0.13.md
          git commit -m 'release: All Star Supplier Sync v2.0.13'
          git push origin main
