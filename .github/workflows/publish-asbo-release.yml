name: Publish ASBO Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ASBO version to publish, e.g. 1.1.5"
        required: true
        type: string
  issues:
    types: [opened]
  pull_request:
    types: [closed]
    paths:
      - 'asbo/.publish-trigger'

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, 'PUBLISH ASBO ')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Resolve package and version
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.event_name }}" == "issues" ]]; then
            VERSION="${{ github.event.issue.title }}"
            VERSION="${VERSION#PUBLISH ASBO }"
          else
            VERSION="1.1.5"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          ZIP="asbo/all-star-bulk-order-block-${VERSION}.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Build requested WordPress package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.pkg.outputs.version }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          mkdir -p "$(dirname "$ZIP")"

          if [[ "$VERSION" == '1.1.2' ]]; then
            cat .release-staging/asbo-v1.1.2/part*.b64 | tr -d '\r\n' | base64 --decode > "$ZIP"
            echo '27afc6d7c825b0951278f52afd1daa645f0f4807051e9e3ee9831754b6f3cb06  asbo/all-star-bulk-order-block-1.1.2.zip' | sha256sum --check
            test "$(stat -c%s "$ZIP")" = '36356'
            exit 0
          fi

          if [[ "$VERSION" == '1.1.3' ]]; then
            cat .release-staging/asbo-v1.1.3/part*.b64 | tr -d '\r\n' | base64 --decode > "$ZIP"
            echo '0d2e74df48eb11124c12d300305ecf9fef9f5aacb4588a00a89b77d6361ce16a  asbo/all-star-bulk-order-block-1.1.3.zip' | sha256sum --check
            test "$(stat -c%s "$ZIP")" = '40675'
            exit 0
          fi

          if [[ "$VERSION" != '1.1.4' && "$VERSION" != '1.1.5' ]]; then
            echo "No deterministic ASBO build recipe exists for $VERSION" >&2
            exit 1
          fi

          BASE='/tmp/asbo-v1.1.3.zip'
          WORK="/tmp/asbo-${VERSION}"
          cat .release-staging/asbo-v1.1.3/part*.b64 | tr -d '\r\n' | base64 --decode > "$BASE"
          echo '0d2e74df48eb11124c12d300305ecf9fef9f5aacb4588a00a89b77d6361ce16a  /tmp/asbo-v1.1.3.zip' | sha256sum --check

          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$BASE" -d "$WORK"

          # v1.1.4 patch paths include the plugin directory itself.
          (
            cd "$WORK"
            patch -p1 < "$GITHUB_WORKSPACE/asbo/patches/1.1.4.patch"
          )

          # v1.1.5 is a patch against the already-built v1.1.4 plugin folder.
          if [[ "$VERSION" == '1.1.5' ]]; then
            (
              cd "$WORK/all-star-bulk-order-block-v1.0.0"
              patch -p1 < "$GITHUB_WORKSPACE/asbo/patches/1.1.5.patch"
            )
          fi

          MAIN="$WORK/all-star-bulk-order-block-v1.0.0/all-star-bulk-order-block.php"
          BLOCK="$WORK/all-star-bulk-order-block-v1.0.0/block/block.json"
          EDITOR_JS="$WORK/all-star-bulk-order-block-v1.0.0/block/editor.js"
          EDITOR_CSS="$WORK/all-star-bulk-order-block-v1.0.0/block/editor.css"
          README="$WORK/all-star-bulk-order-block-v1.0.0/README.txt"

          php -l "$MAIN"
          node --check "$EDITOR_JS"
          python3 -m json.tool "$BLOCK" >/dev/null
          python3 - <<PY
          from pathlib import Path
          p=Path('$MAIN')
          s=p.read_text()
          marker="        return <<<'JS'\n"
          start=s.index(marker,s.index('private static function inline_js'))+len(marker)
          end=s.index('\nJS;',start)
          Path('/tmp/asbo-inline.js').write_text(s[start:end])
          PY
          node --check /tmp/asbo-inline.js

          if [[ "$VERSION" == '1.1.4' ]]; then
            echo '05ae6d0d79d156e7f788f9b89d771d8ceedaedfb2bdadc4d4b6a4b1495607f18  '"$MAIN" | sha256sum --check
            echo 'b17476a725f3f6610cd1d3064607ef08a0402931ea4c0c6da23c6dbef5991d60  '"$BLOCK" | sha256sum --check
            echo '7cfe72a41880c8ec1f6ca8dfeffc74284fdf2665d47bf2aa124d6e0d6c9c070d  '"$README" | sha256sum --check
          else
            echo 'b2b01ae3b1eed4a016f7432fb7d6ecd8c9fb6d173c04293c3edea6786f0d95ae  '"$MAIN" | sha256sum --check
            echo '08e271f18482f68ba6778ce7ab1c3fb7d34c1158a5f2391640cf76310a7222bf  '"$BLOCK" | sha256sum --check
            echo '738681e383c57af82630db503be9d41aa2ab6b0fa28296f56842bd2040468b9d  '"$EDITOR_JS" | sha256sum --check
            echo '7a0e0ee84d3222709ce2a15ece822db38864498fa629374fc6e58b147d178ee3  '"$EDITOR_CSS" | sha256sum --check
            echo 'c233e0add85ae610376e6562672b8467f8bb7a62c4b1b28711093ea8b0022d03  '"$README" | sha256sum --check
            grep -q '10K Stitch Allowance' "$MAIN"
            grep -q '10,000 stitches per design' "$MAIN"
            grep -q 'before production' "$MAIN"
          fi

          (
            cd "$WORK"
            zip -qr "$GITHUB_WORKSPACE/$ZIP" all-star-bulk-order-block-v1.0.0
          )

      - name: Validate WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.pkg.outputs.zip }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          test -f "$ZIP"
          unzip -t "$ZIP" >/dev/null
          unzip -l "$ZIP" | grep -q 'all-star-bulk-order-block-v1.0.0/all-star-bulk-order-block.php'
          unzip -p "$ZIP" all-star-bulk-order-block-v1.0.0/all-star-bulk-order-block.php | grep -q "Version: $VERSION"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.pkg.outputs.version }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          TAG="asbo-v${VERSION}"
          ASSET="all-star-bulk-order-block-${VERSION}.zip"
          cp "$ZIP" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target main --title "All Star Bulk Order Block v${VERSION}" --notes-file "asbo/RELEASE-${VERSION}.md"
          fi

      - name: Point WordPress updater to release asset
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.pkg.outputs.version }}"
          python3 - <<PY
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('asbo/latest.json')
          data=json.loads(p.read_text())
          data['version']='$VERSION'
          data['download_url']=f'https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/asbo-v$VERSION/all-star-bulk-order-block-$VERSION.zip'
          data['last_updated']=datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S +0000')
          if '$VERSION' == '1.1.4':
              data['changelog']='<h4>1.1.4</h4><ul><li>WooCommerce Regular Price is now the authoritative customer-facing 1+ price.</li><li>Legacy 1: ASBO matrix entries are ignored; all established bulk tiers above 1 remain unchanged.</li><li>Total Saved uses Woo Regular Price as its normal-price baseline.</li><li>ASBO does not read or expose unit_buy_price, supplier price_breaks, MAP, MSRP, suggested retail, or list prices.</li><li>Missing Woo Regular Price now fails clearly and directs admins to Supplier Sync Quick Repair.</li><li>Removed the legacy blank-price purchasability bypass.</li></ul>'
          elif '$VERSION' == '1.1.5':
              data['changelog']='<h4>1.1.5</h4><ul><li>Clarifies that standard embroidery pricing includes up to 10,000 stitches per design.</li><li>Adds a compact 10K stitch allowance note beside embroidery pricing.</li><li>Adds a detailed 10K Stitch Allowance explanation in the Artwork step.</li><li>Any additional embroidery charge is communicated before production begins.</li><li>No pricing calculations, bulk tiers, checkout rules, or supplier pricing were changed.</li></ul>'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asbo/latest.json
          git commit -m "release: point ASBO updater to $VERSION release asset" || exit 0
          git push
