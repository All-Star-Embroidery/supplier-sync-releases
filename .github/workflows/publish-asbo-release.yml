name: Publish ASBO Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ASBO version to publish, e.g. 1.1.1"
        required: true
        type: string
  push:
    paths:
      - '.github/workflows/publish-asbo-release.yml'
      - 'asbo/all-star-bulk-order-block-*.zip'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Resolve package and version
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="1.1.1"
          fi
          ZIP="asbo/all-star-bulk-order-block-${VERSION}.zip"
          test -f "$ZIP"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Validate WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.pkg.outputs.zip }}"
          unzip -t "$ZIP" >/dev/null
          unzip -l "$ZIP" | grep -q 'all-star-bulk-order-block-v1.0.0/all-star-bulk-order-block.php'

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.pkg.outputs.version }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          TAG="asbo-v${VERSION}"
          ASSET="all-star-bulk-order-block-${VERSION}.zip"
          cp "$ZIP" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "All Star Bulk Order Block v${VERSION}" \
              --notes-file "asbo/RELEASE-${VERSION}.md"
          fi
