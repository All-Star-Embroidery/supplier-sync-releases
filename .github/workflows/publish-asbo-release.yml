name: Publish ASBO Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ASBO version to publish, e.g. 1.1.2"
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, 'PUBLISH ASBO '))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Resolve package and version
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.event.issue.title }}"
            VERSION="${VERSION#PUBLISH ASBO }"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          ZIP="asbo/all-star-bulk-order-block-${VERSION}.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Restore exact validated v1.1.2 archive
        if: steps.pkg.outputs.version == '1.1.2'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.pkg.outputs.zip }}"
          mkdir -p "$(dirname "$ZIP")"
          cat .release-staging/asbo-v1.1.2/part*.b64 | tr -d '\r\n' | base64 --decode > "$ZIP"
          echo '27afc6d7c825b0951278f52afd1daa645f0f4807051e9e3ee9831754b6f3cb06  asbo/all-star-bulk-order-block-1.1.2.zip' | sha256sum --check
          test "$(stat -c%s asbo/all-star-bulk-order-block-1.1.2.zip)" = '36356'

      - name: Validate WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.pkg.outputs.zip }}"
          test -f "$ZIP"
          unzip -t "$ZIP" >/dev/null
          unzip -l "$ZIP" | grep -q 'all-star-bulk-order-block-v1.0.0/all-star-bulk-order-block.php'

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.pkg.outputs.version }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          TAG="asbo-v${VERSION}"
          ASSET="all-star-bulk-order-block-${VERSION}.zip"
          cp "$ZIP" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target main \
              --title "All Star Bulk Order Block v${VERSION}" \
              --notes-file "asbo/RELEASE-${VERSION}.md"
          fi

      - name: Point WordPress updater to release asset
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.pkg.outputs.version }}"
          python3 - <<PY
          import json
          from pathlib import Path
          p=Path('asbo/latest.json')
          data=json.loads(p.read_text())
          data['version']='$VERSION'
          data['download_url']=f'https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/asbo-v$VERSION/all-star-bulk-order-block-$VERSION.zip'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asbo/latest.json
          git commit -m "release: point ASBO updater to $VERSION release asset" || exit 0
          git push
