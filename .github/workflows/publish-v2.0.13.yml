name: Publish Supplier Sync v2.0.13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2.0.13.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP='all-star-supplier-sync-2.0.13.zip'
          unzip -t "$ZIP" >/dev/null
          unzip -p "$ZIP" all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.13'
          if gh release view v2.0.13 >/dev/null 2>&1; then
            gh release upload v2.0.13 "$ZIP" --clobber
            gh release edit v2.0.13 --title 'All Star Supplier Sync v2.0.13' --notes-file RELEASE-2.0.13.md
          else
            gh release create v2.0.13 "$ZIP" --target main --title 'All Star Supplier Sync v2.0.13' --notes-file RELEASE-2.0.13.md
          fi
