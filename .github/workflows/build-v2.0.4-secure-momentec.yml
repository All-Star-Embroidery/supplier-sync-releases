name: Build Supplier Sync v2.0.4 Secure Momentec Credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v2.0.4-secure-momentec.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download exact v2.0.3 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asss-v204 /tmp/asss-v203.zip
          mkdir -p /tmp/asss-v204
          gh release download v2.0.3 \
            --pattern 'all-star-supplier-sync-2.0.3.zip' \
            --output /tmp/asss-v203.zip
          echo '39844901328845e81c5442adefe2b542c04081655a6b90fc229535f6586c5af4  /tmp/asss-v203.zip' | sha256sum -c -
          unzip -q /tmp/asss-v203.zip -d /tmp/asss-v204
          test -f /tmp/asss-v204/all-star-supplier-sync/all-star-supplier-sync.php

      - name: Harden Momentec credential storage and bump version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/asss-v204/all-star-supplier-sync')

          # Main bootstrap: version only. Keep the exact v2.0.3 bootstrap otherwise.
          main = root / 'all-star-supplier-sync.php'
          text = main.read_text(encoding='utf-8')
          text = text.replace('Version: 2.0.3', 'Version: 2.0.4', 1)
          text = text.replace("define('ASSS_VERSION', '2.0.3');", "define('ASSS_VERSION', '2.0.4');", 1)
          if 'Version: 2.0.4' not in text or "define('ASSS_VERSION', '2.0.4');" not in text:
              raise SystemExit('Could not bump plugin version safely.')
          main.write_text(text, encoding='utf-8')

          # Replace the v2.0.3 groundwork adapter with a secure credential boundary.
          momentec = root / 'includes/class-asss-momentec.php'
          momentec.write_text(r'''<?php
          if (!defined('ABSPATH')) exit;

          /**
           * Momentec API adapter groundwork.
           *
           * Sensitive credentials are intentionally NOT stored in the WordPress
           * database. Configure them in wp-config.php or as server environment
           * variables using:
           *
           *   ASSS_MOMENTEC_USERNAME
           *   ASSS_MOMENTEC_PASSWORD
           *
           * Constants take precedence over environment variables. The adapter
           * still does not guess Momentec endpoint paths or authentication
           * headers; live staging calls are enabled only after the account's
           * official API contract is verified.
           */
          class ASSS_Momentec {
              public const KEY = 'momentec';
              public const LABEL = 'Momentec Brands';
              public const USERNAME_KEY = 'ASSS_MOMENTEC_USERNAME';
              public const PASSWORD_KEY = 'ASSS_MOMENTEC_PASSWORD';

              public function __construct() {
                  // v2.0.3 briefly allowed credential-shaped values in asss_settings.
                  // Remove those legacy values from the database on the next admin load.
                  add_action('admin_init', [$this, 'purge_legacy_database_credentials'], 1);
              }

              public function settings(): array {
                  $s = get_option('asss_settings', []);
                  return is_array($s) ? $s : [];
              }

              private function secure_value(string $key): string {
                  if (defined($key)) {
                      $value = constant($key);
                      return is_scalar($value) ? trim((string)$value) : '';
                  }
                  $value = getenv($key);
                  return $value === false ? '' : trim((string)$value);
              }

              private function secure_source(string $key): string {
                  if (defined($key) && $this->secure_value($key) !== '') return 'wp-config.php constant';
                  $value = getenv($key);
                  if ($value !== false && trim((string)$value) !== '') return 'server environment variable';
                  return '';
              }

              public function username(): string {
                  return $this->secure_value(self::USERNAME_KEY);
              }

              public function password(): string {
                  return $this->secure_value(self::PASSWORD_KEY);
              }

              public function credentials_configured(): bool {
                  return $this->username() !== '' && $this->password() !== '';
              }

              public function credential_source(): string {
                  $user = $this->secure_source(self::USERNAME_KEY);
                  $pass = $this->secure_source(self::PASSWORD_KEY);
                  if ($user !== '' && $pass !== '' && $user === $pass) return $user;
                  if ($user !== '' || $pass !== '') return 'mixed secure sources';
                  return '';
              }

              public function configured(): bool {
                  $s = $this->settings();
                  return !empty($s['momentec_enabled'])
                      && trim((string)($s['momentec_api_base'] ?? '')) !== ''
                      && $this->credentials_configured();
              }

              public function environment(): string {
                  $v = sanitize_key((string)($this->settings()['momentec_environment'] ?? 'staging'));
                  return in_array($v, ['staging','production'], true) ? $v : 'staging';
              }

              public function purge_legacy_database_credentials(): void {
                  if (!current_user_can('manage_woocommerce')) return;
                  $s = get_option('asss_settings', []);
                  if (!is_array($s)) return;
                  $changed = false;
                  foreach (['momentec_username','momentec_password','momentec_api_key','momentec_secret'] as $key) {
                      if (array_key_exists($key, $s)) {
                          unset($s[$key]);
                          $changed = true;
                      }
                  }
                  if ($changed) update_option('asss_settings', $s, false);
              }

              public function status(): array {
                  return [
                      'supplier' => self::KEY,
                      'label' => self::LABEL,
                      'configured' => $this->configured(),
                      'enabled' => !empty($this->settings()['momentec_enabled']),
                      'environment' => $this->environment(),
                      'username_configured' => $this->username() !== '',
                      'password_configured' => $this->password() !== '',
                      'credential_source' => $this->credential_source(),
                      'state' => $this->configured() ? 'credentials-ready' : 'awaiting-secure-api-credentials',
                      'catalog_sync' => 'not-enabled-yet',
                      'inventory_sync' => 'not-enabled-yet',
                  ];
              }

              public function capabilities(): array {
                  return [
                      'catalog' => true,
                      'inventory' => true,
                      'orders' => true,
                      'order_status' => true,
                      'live_adapter_enabled' => false,
                  ];
              }
          }
          '''.replace('          ', ''), encoding='utf-8')

          admin = root / 'includes/class-asss-admin.php'
          text = admin.read_text(encoding='utf-8')

          # Never accept Momentec username/password/API-key-shaped fields into the
          # normal WordPress settings option.
          old_keys = "'github_update_repo','github_auto_updates','momentec_enabled','momentec_api_base','momentec_account','momentec_username','momentec_api_key','momentec_environment'"
          new_keys = "'github_update_repo','github_auto_updates','momentec_enabled','momentec_api_base','momentec_account','momentec_environment'"
          if old_keys not in text:
              raise SystemExit('Expected v2.0.3 settings key list was not found.')
          text = text.replace(old_keys, new_keys, 1)

          save_line = "foreach ($keys as $k) $new[$k] = isset($_POST[$k]) ? sanitize_text_field(wp_unslash($_POST[$k])) : 0;"
          replacement = save_line + "\n            foreach (['momentec_username','momentec_password','momentec_api_key','momentec_secret'] as $legacy_key) unset($new[$legacy_key]);"
          if save_line not in text:
              raise SystemExit('Expected settings save loop was not found.')
          text = text.replace(save_line, replacement, 1)

          # Replace database-backed credential fields with secure configuration
          # status/instructions. No secret value is ever rendered into HTML.
          old_ui = """        echo $this->row('Account / customer number', 'momentec_account', $s['momentec_account'] ?? '');
        echo $this->row('API username / client ID', 'momentec_username', $s['momentec_username'] ?? '');
        echo $this->row('API key / secret', 'momentec_api_key', $s['momentec_api_key'] ?? '', 'password');
        echo '<tr><th>Adapter status</th><td><strong>' . esc_html(!empty($momentec['configured']) ? 'Credentials ready for live adapter work' : 'Awaiting Momentec API credentials') . '</strong><p class=\"description\">No speculative endpoint paths or authentication headers are used. Once credentials arrive, we can test staging first and wire catalog + exact variation + inventory normalization into the existing supplier bridge.</p></td></tr></table>';"""
          new_ui = """        echo $this->row('Account / customer number', 'momentec_account', $s['momentec_account'] ?? '');
        $momentec_user_ready = !empty($momentec['username_configured']);
        $momentec_pass_ready = !empty($momentec['password_configured']);
        $momentec_source = (string)($momentec['credential_source'] ?? '');
        echo '<tr><th>API username</th><td><strong>' . ($momentec_user_ready ? 'Configured securely' : 'Not configured') . '</strong><p class=\"description\">Set <code>ASSS_MOMENTEC_USERNAME</code> in wp-config.php or as a server environment variable. The username is not stored in WordPress.</p></td></tr>';
        echo '<tr><th>API password</th><td><strong>' . ($momentec_pass_ready ? 'Configured securely' : 'Not configured') . '</strong><p class=\"description\">Set <code>ASSS_MOMENTEC_PASSWORD</code> in wp-config.php or as a server environment variable. The password is never displayed or stored in WordPress.</p></td></tr>';
        echo '<tr><th>Secure credential source</th><td>' . esc_html($momentec_source !== '' ? $momentec_source : 'Not configured') . '</td></tr>';
        echo '<tr><th>wp-config.php template</th><td><pre style=\"max-width:760px;overflow:auto;background:#f6f7f7;padding:12px;border:1px solid #dcdcde\">define(&#039;ASSS_MOMENTEC_USERNAME&#039;, &#039;YOUR_MOMENTEC_API_USERNAME&#039;);\ndefine(&#039;ASSS_MOMENTEC_PASSWORD&#039;, &#039;YOUR_MOMENTEC_API_PASSWORD&#039;);</pre><p class=\"description\">Add these above the “That’s all, stop editing” line in wp-config.php. Do not paste the real values into GitHub, WordPress settings, support tickets, or chat.</p></td></tr>';
        echo '<tr><th>Adapter status</th><td><strong>' . esc_html(!empty($momentec['configured']) ? 'Secure credentials ready for staging adapter work' : 'Awaiting secure Momentec API credentials') . '</strong><p class=\"description\">Momentec publicly describes staging account credentials for API integrations. Supplier Sync will not guess the exact login request or authentication header; we will verify the live staging contract before enabling catalog or inventory calls.</p></td></tr></table>';"""
          if old_ui not in text:
              raise SystemExit('Expected Momentec settings UI block was not found.')
          text = text.replace(old_ui, new_ui, 1)
          admin.write_text(text, encoding='utf-8')

          # Readme release metadata/changelog.
          readme = root / 'readme.txt'
          text = readme.read_text(encoding='utf-8')
          text = re.sub(r'^Stable tag:\s*2\.0\.3\s*$', 'Stable tag: 2.0.4', text, count=1, flags=re.M)
          if '== Changelog ==' in text and '= 2.0.4 =' not in text:
              text = text.replace('== Changelog ==', "== Changelog ==\n\n= 2.0.4 =\n* Security hardening: Momentec username and password are no longer accepted or stored in the WordPress database.\n* Momentec credentials now come from ASSS_MOMENTEC_USERNAME and ASSS_MOMENTEC_PASSWORD in wp-config.php or server environment variables.\n* Automatically removes legacy Momentec credential-shaped values saved by the 2.0.3 groundwork screen.\n* Replaces credential entry fields with secure configuration status and setup instructions.\n", 1)
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Validate PHP and credential handling
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/asss-v204/all-star-supplier-sync
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q 'Version: 2.0.4' "$ROOT/all-star-supplier-sync.php"
          grep -q "define('ASSS_VERSION', '2.0.4')" "$ROOT/all-star-supplier-sync.php"
          grep -q 'ASSS_MOMENTEC_USERNAME' "$ROOT/includes/class-asss-momentec.php"
          grep -q 'ASSS_MOMENTEC_PASSWORD' "$ROOT/includes/class-asss-momentec.php"
          ! grep -q 'name="momentec_username"' "$ROOT/includes/class-asss-admin.php"
          ! grep -q 'name="momentec_api_key"' "$ROOT/includes/class-asss-admin.php"
          ! grep -q 'name="momentec_password"' "$ROOT/includes/class-asss-admin.php"

      - name: Build WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/asss-v204
          zip -qr "$GITHUB_WORKSPACE/all-star-supplier-sync-2.0.4.zip" all-star-supplier-sync
          cd "$GITHUB_WORKSPACE"
          unzip -t all-star-supplier-sync-2.0.4.zip >/dev/null
          unzip -p all-star-supplier-sync-2.0.4.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.4'
          sha256sum all-star-supplier-sync-2.0.4.zip > SHA256-2.0.4.txt

      - name: Update release metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'JSON'
          {
            "version": "2.0.4",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.4/all-star-supplier-sync-2.0.4.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.4",
            "name": "All Star Supplier Sync v2.0.4"
          }
          JSON
          cat > RELEASE-2.0.4.md <<'MD'
          # All Star Supplier Sync v2.0.4

          Security-focused Momentec groundwork update.

          - Momentec API username/password are no longer stored in the WordPress database.
          - Credentials are read from `ASSS_MOMENTEC_USERNAME` and `ASSS_MOMENTEC_PASSWORD` in `wp-config.php` or server environment variables.
          - Legacy Momentec credential-shaped option values are automatically purged from `asss_settings` for WooCommerce administrators.
          - The Settings screen displays only secure configuration status, never credential values.
          - Momentec live API calls remain disabled until the official staging authentication contract and response schema are verified.
          MD

      - name: Commit v2.0.4 package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-supplier-sync-2.0.4.zip latest.json RELEASE-2.0.4.md SHA256-2.0.4.txt
          git commit -m 'release: All Star Supplier Sync v2.0.4 secure Momentec credentials'
          git push origin main
