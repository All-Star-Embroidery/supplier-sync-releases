name: Recover Supplier Sync v2.0.3 Remaining Records

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-v2.0.3-continue.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decode and recover all readable local records
        shell: bash
        run: |
          set -euo pipefail
          cat .release-staging/2.0.3/part-*.txt | base64 --decode > /tmp/v203.raw
          python3 - <<'PY'
          import binascii, struct, zlib
          from pathlib import Path

          raw = Path('/tmp/v203.raw').read_bytes()
          out = Path('/tmp/recovered-v203-all')
          out.mkdir(parents=True, exist_ok=True)
          report=[]
          pos=0
          files=0
          corrupt=[]

          while pos + 30 <= len(raw) and raw[pos:pos+4] == b'PK\x03\x04':
              sig, ver, flag, method, mt, md, crc, csize, usize, nlen, xlen = struct.unpack_from('<4s5H3L2H', raw, pos)
              ns=pos+30
              ds=ns+nlen+xlen
              name=raw[ns:ns+nlen].decode('utf-8','replace')
              if flag & 0x08:
                  report.append(f'stop descriptor_flag name={name} offset={pos}')
                  break
              end=ds+csize
              if end > len(raw):
                  report.append(f'stop truncated name={name} need={end} have={len(raw)}')
                  break
              cdata=raw[ds:end]
              try:
                  content = cdata if method == 0 else zlib.decompress(cdata,-15)
              except Exception as exc:
                  report.append(f'stop decompress name={name} error={type(exc).__name__}:{exc}')
                  break
              calc=binascii.crc32(content)&0xffffffff
              crc_ok=(crc==0 or calc==crc)
              size_ok=(usize==0 or len(content)==usize)
              report.append(f'name={name} offset={pos} next={end} csize={csize} usize={usize} out={len(content)} crc_ok={int(crc_ok)} size_ok={int(size_ok)}')
              if not crc_ok or not size_ok:
                  corrupt.append(name)
              p=Path(name)
              if p.is_absolute() or '..' in p.parts:
                  report.append(f'stop unsafe={name}')
                  break
              dest=out/p
              if name.endswith('/'):
                  dest.mkdir(parents=True,exist_ok=True)
              else:
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(content)
                  files += 1
              pos=end

          report += [f'raw_bytes={len(raw)}', f'final_offset={pos}', f'files={files}', 'crc_or_size_warnings=' + ','.join(corrupt)]
          (out/'RECOVERY-REPORT.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          print('\n'.join(report[-12:]))
          PY

      - name: Publish full local-record recovery branch
        env:
          BRANCH: recovery/v2.0.3-all-records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan "$BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          if [[ -d /tmp/recovered-v203-all/all-star-supplier-sync ]]; then
            cp -a /tmp/recovered-v203-all/all-star-supplier-sync/. .
          fi
          cp /tmp/recovered-v203-all/RECOVERY-REPORT.txt .
          git add -A
          git commit -m 'Recover all readable Supplier Sync v2.0.3 ZIP records'
          git push --force origin "$BRANCH"
