name: Build and Publish Supplier Sync v2.0.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-v2.0.8-momentec-row-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: release

      - name: Checkout exact v2.0.7 source
        uses: actions/checkout@v6
        with:
          ref: recovery/v2.0.7-exact-source
          path: source

      - name: Apply v2.0.8 Momentec row import UX patch
        shell: bash
        run: |
          set -euo pipefail
          python3 release/release-tools/v208_patch.py source

      - name: Validate PHP and row import behavior
        shell: bash
        run: |
          set -euo pipefail
          find source -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q 'Version: 2.0.8' source/all-star-supplier-sync.php
          grep -q "define('ASSS_VERSION', '2.0.8')" source/all-star-supplier-sync.php
          grep -q "asss_momentec_queue_style" source/includes/class-asss-admin.php
          grep -q '>Import</' source/includes/class-asss-admin.php
          grep -q 'Import queued' source/includes/class-asss-admin.php
          grep -q 'Retry Import' source/includes/class-asss-admin.php
          grep -q 'Prepare Selected for Import' source/includes/class-asss-admin.php
          grep -q 'return_catalog_page' source/includes/class-asss-admin.php
          ! grep -q 'Select this row above' source/includes/class-asss-admin.php
          ! grep -q 'Automatic GitHub hydration queued' source/includes/class-asss-admin.php

      - name: Validate credential boundary remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -q 'ASSS_MOMENTEC_USERNAME\|ASSS_MOMENTEC_PASSWORD' source
          ! grep -R -q 'MOMENTEC_USERNAME\|MOMENTEC_PASSWORD' source
          ! grep -R -q 'name="momentec_username"\|name="momentec_password"\|name="momentec_api_key"' source

      - name: Build and validate WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' source/ package/all-star-supplier-sync/
          cd package
          zip -qr ../release/all-star-supplier-sync-2.0.8.zip all-star-supplier-sync
          cd ../release
          unzip -t all-star-supplier-sync-2.0.8.zip >/dev/null
          unzip -p all-star-supplier-sync-2.0.8.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.8'
          sha256sum all-star-supplier-sync-2.0.8.zip

      - name: Prepare release metadata
        working-directory: release
        shell: bash
        run: |
          cat > latest.json <<'JSON'
          {
            "version": "2.0.8",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.8/all-star-supplier-sync-2.0.8.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.8",
            "name": "All Star Supplier Sync v2.0.8"
          }
          JSON
          cat > RELEASE-2.0.8.md <<'MD'
          # All Star Supplier Sync v2.0.8

          Momentec catalog import UX refinement.

          - Every Momentec catalog row now has its own **Import** action.
          - Clicking Import on a style that still needs customer-specific details automatically queues that one style for GitHub hydration.
          - Queued/processing styles show **Import queued** instead of instructional text.
          - Failed hydration rows show **Retry Import**.
          - Ready styles show **Import** and open the existing review/color-selection/import screen.
          - Search, brand, category, and catalog page are preserved after queueing a row.
          - Bulk checkboxes remain available as an optional **Prepare Selected for Import** action.
          - Removes the confusing "Select this row above" / "Fetch this row above" style of workflow.
          - Momentec credentials remain exclusively in GitHub Actions Secrets.
          MD

      - name: Publish exact v2.0.8 source branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release source: All Star Supplier Sync v2.0.8'
          git push --force origin HEAD:recovery/v2.0.8-exact-source

      - name: Commit v2.0.8 package and metadata
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-supplier-sync-2.0.8.zip latest.json RELEASE-2.0.8.md
          git commit -m 'release: All Star Supplier Sync v2.0.8'
          git push origin main

      - name: Publish GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.8 >/dev/null 2>&1; then
            gh release upload v2.0.8 all-star-supplier-sync-2.0.8.zip --clobber
            gh release edit v2.0.8 --title 'All Star Supplier Sync v2.0.8' --notes-file RELEASE-2.0.8.md
          else
            gh release create v2.0.8 all-star-supplier-sync-2.0.8.zip --target main --title 'All Star Supplier Sync v2.0.8' --notes-file RELEASE-2.0.8.md
          fi
