name: Build Supplier Sync v2.0.23

on:
  push:
    paths:
      - '.github/workflows/build-v2.0.23.yml'
      - '.release-tools/build_v2023.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact v2.0.22 source
        uses: actions/checkout@v6
        with:
          ref: recovery/v2.0.22-exact-source
          path: source

      - name: Checkout release repository
        uses: actions/checkout@v6
        with:
          ref: main
          path: release
          fetch-depth: 0

      - name: Apply v2.0.23 patch
        run: python3 release/.release-tools/build_v2023.py

      - name: Validate source
        run: |
          find source -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source/includes/class-asss-importer.php').read_text()
          checks=[
            "Snapback Trucker Cap (Richardson 112)",
            "sync_product_discovery_taxonomy",
            "sync_supplier_discovery_tags",
            "discovery_tags_from_text",
            "discovery_categories_from_title",
            "migrate_discovery_taxonomy_and_titles_v2023",
            "Trucker Hat",
            "Mesh Back",
            "Moisture Wicking",
            "_discovery_tags",
          ]
          for needle in checks: assert needle in s, needle
          assert "Version: 2.0.23" in Path('source/all-star-supplier-sync.php').read_text()
          assert "Stable tag: 2.0.23" in Path('source/readme.txt').read_text()
          print('v2.0.23 title/discovery taxonomy invariants passed')
          PY

      - name: Save exact v2.0.23 source branch
        working-directory: release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B recovery/v2.0.23-exact-source
          git rm -rf . >/dev/null 2>&1 || true
          rsync -a --exclude='.git' ../source/ ./
          git add -A
          git commit -m 'release: exact v2.0.23 source' || true
          git push --force origin recovery/v2.0.23-exact-source
          git checkout main

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf package && mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' --exclude='.github' source/ package/all-star-supplier-sync/
          (cd package && zip -qr ../all-star-supplier-sync-2.0.23.zip all-star-supplier-sync)
          SHA=$(sha256sum all-star-supplier-sync-2.0.23.zip | awk '{print $1}')
          cd release
          git checkout main
          git pull --ff-only
          cat > latest.json <<EOF
          {
            "version": "2.0.23",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.23/all-star-supplier-sync-2.0.23.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.23",
            "name": "All Star Supplier Sync v2.0.23"
          }
          EOF
          git add latest.json
          git commit -m 'release: point updater to v2.0.23'
          git push
          gh release create v2.0.23 ../all-star-supplier-sync-2.0.23.zip --title 'All Star Supplier Sync v2.0.23' --notes "Canonical Richardson 112 title plus standardized discovery categories/tags across SanMar, S&S, and Momentec. SHA-256: $SHA"

      - name: Cleanup temporary release tooling
        if: success()
        working-directory: release
        run: |
          git pull --ff-only
          git rm .github/workflows/build-v2.0.23.yml .release-tools/build_v2023.py
          git commit -m 'maintenance: remove temporary v2.0.23 build tooling'
          git push
