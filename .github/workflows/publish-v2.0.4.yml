name: Publish Supplier Sync v2.0.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2.0.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v5

      - name: Validate package
        run: |
          set -euo pipefail
          test -f all-star-supplier-sync-2.0.4.zip
          unzip -t all-star-supplier-sync-2.0.4.zip >/dev/null
          unzip -p all-star-supplier-sync-2.0.4.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.4'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.4 >/dev/null 2>&1; then
            gh release upload v2.0.4 all-star-supplier-sync-2.0.4.zip --clobber
          else
            gh release create v2.0.4 all-star-supplier-sync-2.0.4.zip \
              --target "$GITHUB_SHA" \
              --title 'All Star Supplier Sync v2.0.4' \
              --notes 'Security-focused Momentec groundwork update. Momentec API username and password are no longer stored in the WordPress database; they are read from ASSS_MOMENTEC_USERNAME and ASSS_MOMENTEC_PASSWORD in wp-config.php or server environment variables. Legacy Momentec credential-shaped option values are purged, the Settings screen shows only secure configuration status, and live Momentec API calls remain disabled until the official staging authentication contract is verified.'
          fi
