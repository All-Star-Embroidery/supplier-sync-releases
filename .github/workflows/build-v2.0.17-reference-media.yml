name: Build Supplier Sync v2.0.17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v2.0.17-reference-media.yml'
      - '.release-tools/v2017_patch.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact v2.0.16 source
        uses: actions/checkout@v5
        with:
          ref: recovery/v2.0.16-exact-source
          fetch-depth: 0
          path: source

      - name: Checkout release repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          path: release

      - name: Patch source
        run: python3 release/.release-tools/v2017_patch.py source

      - name: Validate PHP and media invariants
        shell: bash
        run: |
          set -euo pipefail
          find source -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          from pathlib import Path
          main=Path('source/all-star-supplier-sync.php').read_text()
          imp=Path('source/includes/class-asss-importer.php').read_text()
          checks={
            'version header':'Version: 2.0.17' in main,
            'version constant':"define('ASSS_VERSION', '2.0.17')" in main,
            'shared reference storage':'save_supplier_reference_media' in imp,
            'SanMar swatch reference':"['COLOR_SWATCH_IMAGE','COLOR_SQUARE_IMAGE']" in imp,
            'SanMar swatch absent from gallery list':"'BACK_FLAT','FRONT_MODEL','BACK_MODEL','SIDE_MODEL','THREE_Q_MODEL','COLOR_SWATCH_IMAGE'" not in imp,
            'S&S classifier retained':'ss_classify_variant_media' in imp,
            'Momentec classifier':'momentec_classify_variant_media' in imp,
            'Momentec reference storage':"save_supplier_reference_media($product_id,'momentec'" in imp,
            'Momentec no raw gallery import':"foreach((array)($row['gallery'] ?? []) as $raw){$u=$this->momentec_media_url" not in imp,
            'manual media protection':'!$this->is_supplier_attachment' in imp,
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          if failed: raise SystemExit('Validation failed: '+', '.join(failed))
          PY

      - name: Save exact v2.0.17 source branch
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C recovery/v2.0.17-exact-source
          git add -A
          git commit -m 'release: All Star Supplier Sync v2.0.17 exact source'
          git push --force origin recovery/v2.0.17-exact-source

      - name: Build package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          rm -rf /tmp/asss-v2017
          mkdir -p /tmp/asss-v2017/all-star-supplier-sync
          rsync -a --exclude='.git' ../source/ /tmp/asss-v2017/all-star-supplier-sync/
          (cd /tmp/asss-v2017 && zip -qr "$GITHUB_WORKSPACE/release/all-star-supplier-sync-2.0.17.zip" all-star-supplier-sync)
          unzip -t all-star-supplier-sync-2.0.17.zip >/dev/null
          unzip -p all-star-supplier-sync-2.0.17.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.17'
          cat > latest.json <<'JSON'
          {
            "version": "2.0.17",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.17/all-star-supplier-sync-2.0.17.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.17",
            "name": "All Star Supplier Sync v2.0.17"
          }
          JSON
          git add all-star-supplier-sync-2.0.17.zip latest.json
          git commit -m 'release: publish All Star Supplier Sync v2.0.17'
          git push origin main
          SHA=$(sha256sum all-star-supplier-sync-2.0.17.zip | awk '{print $1}')
          gh release create v2.0.17 all-star-supplier-sync-2.0.17.zip \
            --repo rolejarczyk/ASE.SupplierSync-Releases \
            --target main \
            --title 'All Star Supplier Sync v2.0.17' \
            --notes "Global supplier-media hardening. SanMar, S&S Activewear, and Momentec now share the same storefront-vs-reference policy: product photography may reach WooCommerce; swatch sheets, color boards/chips, charts, unknown media types, and Momentec alternate media remain supplier-reference metadata only. Quick Repair cleans existing Supplier Sync-owned reference graphics while preserving merchant media. SHA-256: $SHA"

      - name: Remove temporary release tooling
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd release
          git pull --rebase origin main
          rm -f .github/workflows/build-v2.0.17-reference-media.yml .release-tools/v2017_patch.py
          git add -A
          git commit -m 'ci: remove temporary v2.0.17 release tooling' || true
          git push origin main
