name: Build and Publish Supplier Sync v2.0.28

on:
  push:
    branches:
      - recovery/v2.0.28-exact-source
    paths:
      - '.github/workflows/release-v2028-specific-titles.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout v2.0.28 source branch
        uses: actions/checkout@v5
        with:
          ref: recovery/v2.0.28-exact-source
          fetch-depth: 0

      - name: Apply v2.0.28 source patch
        run: python3 .release-v2028-patch.py

      - name: Validate v2.0.28 source
        shell: bash
        run: |
          set -euo pipefail
          php -l all-star-supplier-sync.php
          php -l includes/class-asss-importer.php
          find includes -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          grep -q 'Version: 2.0.28' all-star-supplier-sync.php
          grep -q "define('ASSS_VERSION', '2.0.28')" all-star-supplier-sync.php
          grep -q 'Stable tag: 2.0.28' readme.txt
          grep -q 'migrate_specific_storefront_titles_v2028' includes/class-asss-importer.php
          grep -q 'Richardson 112 – Snapback Trucker Cap' includes/class-asss-importer.php
          grep -q '_asss_managed_title' includes/class-asss-importer.php
          grep -q 'Preserved merchant-owned product title' includes/class-asss-importer.php
          if grep -Eq '\+ ?20\.0' includes/class-asss-importer.php; then
            echo 'Old +20 pricing formula unexpectedly reappeared' >&2
            exit 1
          fi
          test "$(grep -Eo '\+ ?23\.0' includes/class-asss-importer.php | wc -l)" = '4'
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = 'all-star-supplier-sync.php includes/class-asss-importer.php readme.txt '

      - name: Commit exact source and remove temporary release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-supplier-sync.php includes/class-asss-importer.php readme.txt
          git commit -m 'release: Supplier Sync v2.0.28 specific storefront titles'
          git rm .github/workflows/release-v2028-specific-titles.yml .release-v2028-patch.py
          git commit -m 'maintenance: remove v2.0.28 temporary release files'
          git push origin HEAD:recovery/v2.0.28-exact-source

      - name: Build WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          BUILD=/tmp/asss-build
          rm -rf "$BUILD"
          mkdir -p "$BUILD/all-star-supplier-sync/includes"
          cp all-star-supplier-sync.php readme.txt "$BUILD/all-star-supplier-sync/"
          cp MOMENTEC-API-GROUNDWORK.md V1-ARCHITECTURE.md V2-ARCHITECTURE.md "$BUILD/all-star-supplier-sync/" 2>/dev/null || true
          cp includes/*.php "$BUILD/all-star-supplier-sync/includes/"
          (cd "$BUILD" && zip -qr "$GITHUB_WORKSPACE/all-star-supplier-sync-2.0.28.zip" all-star-supplier-sync)

      - name: Validate WordPress package
        shell: bash
        run: |
          set -euo pipefail
          unzip -t all-star-supplier-sync-2.0.28.zip >/dev/null
          unzip -l all-star-supplier-sync-2.0.28.zip | grep -q 'all-star-supplier-sync/all-star-supplier-sync.php'
          unzip -p all-star-supplier-sync-2.0.28.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.28'
          unzip -p all-star-supplier-sync-2.0.28.zip all-star-supplier-sync/includes/class-asss-importer.php | grep -q 'migrate_specific_storefront_titles_v2028'
          unzip -p all-star-supplier-sync-2.0.28.zip all-star-supplier-sync/includes/class-asss-importer.php | grep -q 'Richardson 112 – Snapback Trucker Cap'
          if unzip -p all-star-supplier-sync-2.0.28.zip all-star-supplier-sync/includes/class-asss-importer.php | grep -Eq '\+ ?20\.0'; then
            echo 'Published ZIP contains old +20 pricing formula' >&2
            exit 1
          fi
          test "$(unzip -p all-star-supplier-sync-2.0.28.zip all-star-supplier-sync/includes/class-asss-importer.php | grep -Eo '\+ ?23\.0' | wc -l)" = '4'
          sha256sum all-star-supplier-sync-2.0.28.zip

      - name: Publish v2.0.28 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v2.0.28 all-star-supplier-sync-2.0.28.zip \
            --repo rolejarczyk/ASE.SupplierSync-Releases \
            --target recovery/v2.0.28-exact-source \
            --title 'All Star Supplier Sync v2.0.28' \
            --notes $'Supplier Sync v2.0.28\n\n- Generic S&S Activewear and Momentec product titles now gain missing brand/style identity so exact products are easier to recognize and search.\n- Richardson style 112 is normalized to Richardson 112 – Snapback Trucker Cap.\n- Titles that are already brand-specific, including Delta and Comfort Colors naming, are preserved instead of mechanically rewritten.\n- Existing Supplier Sync-managed generic titles are repaired once; merchant-edited/custom WooCommerce titles are preserved.\n- GitHub normalization retains the original supplier wording separately as supplier_title.\n- Pricing remains unit_buy_price + $23. Inventory, exact variation matching, media, taxonomy, shipping weights, and ASBO behavior are unchanged.'
