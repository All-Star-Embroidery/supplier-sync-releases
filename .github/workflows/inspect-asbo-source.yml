name: Inspect ASBO Source

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'INSPECT ASBO ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Rebuild ASBO v1.1.6 and print relevant details code
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/asbo-v1.1.3.zip
          WORK=/tmp/asbo-inspect
          cat .release-staging/asbo-v1.1.3/part*.b64 | tr -d '\r\n' | base64 --decode > "$BASE"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$BASE" -d "$WORK"
          ( cd "$WORK" && patch -p1 < "$GITHUB_WORKSPACE/asbo/patches/1.1.4.patch" )
          ( cd "$WORK/all-star-bulk-order-block-v1.0.0" && patch -p1 < "$GITHUB_WORKSPACE/asbo/patches/1.1.5.patch" )
          ( cd "$WORK/all-star-bulk-order-block-v1.0.0" && patch -p1 < "$GITHUB_WORKSPACE/asbo/patches/1.1.6.patch" )
          MAIN="$WORK/all-star-bulk-order-block-v1.0.0/all-star-bulk-order-block.php"
          echo '=== Product row markup ==='
          sed -n '1188,1235p' "$MAIN"
          echo '=== Product trigger CSS ==='
          grep -n -A 90 -B 10 '^\.asbo__product-trigger' "$MAIN" | head -n 180 || true
          echo '=== Product title/mobile CSS ==='
          grep -n -A 70 -B 10 -E '^\.asbo__product-title-wrap|^  \.asbo__product-trigger|^  \.asbo__product-title-wrap' "$MAIN" | head -n 260 || true
          echo '=== Details button CSS ==='
          grep -n -A 55 -B 10 '^\.asbo__details-button' "$MAIN" || true
          echo '=== Click handler ==='
          sed -n '4828,4888p' "$MAIN"
