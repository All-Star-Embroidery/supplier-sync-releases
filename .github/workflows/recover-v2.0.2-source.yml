name: Recover Supplier Sync v2.0.2 Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-v2.0.2-source.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact v2.0.2 release asset
        run: |
          set -euo pipefail
          curl -L --fail \
            'https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.2/all-star-supplier-sync-2.0.2.zip' \
            -o /tmp/all-star-supplier-sync-2.0.2.zip
          mkdir -p /tmp/recovered
          unzip -q /tmp/all-star-supplier-sync-2.0.2.zip -d /tmp/recovered
          test -f /tmp/recovered/all-star-supplier-sync/all-star-supplier-sync.php

      - name: Publish recovered source branch
        env:
          BRANCH: recovery/v2.0.2-source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan "$BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/recovered/all-star-supplier-sync/. .
          git add -A
          git commit -m 'Recover exact Supplier Sync v2.0.2 source'
          git push --force origin "$BRANCH"
