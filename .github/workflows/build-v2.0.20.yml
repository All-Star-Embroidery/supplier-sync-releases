name: Build Supplier Sync v2.0.20

on:
  push:
    paths:
      - '.github/workflows/build-v2.0.20.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact v2.0.19 source
        uses: actions/checkout@v6
        with:
          ref: recovery/v2.0.19-exact-source
          path: src
          fetch-depth: 0

      - name: Checkout release repository
        uses: actions/checkout@v6
        with:
          ref: main
          path: rel
          fetch-depth: 0

      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 rel/.release-tools/patch-v2.0.20.py

      - name: Validate PHP and v2.0.20 invariants
        shell: bash
        run: |
          set -euo pipefail
          find src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          cat /tmp/php-lint.txt
          python3 - <<'PY'
          from pathlib import Path
          admin=Path('src/includes/class-asss-admin.php').read_text()
          imp=Path('src/includes/class-asss-importer.php').read_text()
          mom=Path('src/includes/class-asss-momentec.php').read_text()
          main=Path('src/all-star-supplier-sync.php').read_text()
          readme=Path('src/readme.txt').read_text()
          checks={
            'danger zone':'Danger Zone',
            'typed confirmation':"$phrase !== 'REGENERATE'",
            'ack confirmation':'asss_regen_ack',
            'ready view':'Ready to Import',
            'return view':'return_momentec_view',
            'catalog ready filter':"$view==='ready' && !isset($hydrated[$key])",
            'default helper':'set_new_product_alphabetical_defaults',
            'sanmar default':'if ($is_new) $this->set_new_product_alphabetical_defaults($product_id);',
            'momentec version':"define('ASSS_VERSION', '2.0.20');",
            'stable tag':'Stable tag: 2.0.20',
          }
          haystack='\n'.join([admin,imp,mom,main,readme])
          missing=[k for k,v in checks.items() if v not in haystack]
          if missing: raise SystemExit('Missing invariants: '+', '.join(missing))
          if admin.count('Generate New Bridge Token') != 1:
              raise SystemExit('Expected exactly one Generate New Bridge Token control in Settings')
          if imp.count('set_new_product_alphabetical_defaults($product_id)') < 3:
              raise SystemExit('Default variation helper is not wired to all three supplier imports')
          print('v2.0.20 source invariants passed')
          PY

      - name: Save exact v2.0.20 source branch
        shell: bash
        run: |
          set -euo pipefail
          cd src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C recovery/v2.0.20-exact-source
          git add -A
          git commit -m 'release: exact v2.0.20 plugin source'
          git push --force-with-lease origin HEAD:refs/heads/recovery/v2.0.20-exact-source

      - name: Build package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' src/ package/all-star-supplier-sync/
          rm -rf package/all-star-supplier-sync/.github package/all-star-supplier-sync/.release-tools
          (cd package && zip -qr ../rel/all-star-supplier-sync-2.0.20.zip all-star-supplier-sync)
          unzip -t rel/all-star-supplier-sync-2.0.20.zip >/dev/null
          unzip -l rel/all-star-supplier-sync-2.0.20.zip | grep -q 'all-star-supplier-sync/all-star-supplier-sync.php'
          SHA=$(sha256sum rel/all-star-supplier-sync-2.0.20.zip | awk '{print $1}')
          cat > rel/latest.json <<EOF
          {
            "version": "2.0.20",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.20/all-star-supplier-sync-2.0.20.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.20",
            "name": "All Star Supplier Sync v2.0.20"
          }
          EOF
          cd rel
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-supplier-sync-2.0.20.zip latest.json
          git commit -m 'release: publish Supplier Sync v2.0.20'
          git push origin main
          gh release create v2.0.20 all-star-supplier-sync-2.0.20.zip \
            --target main \
            --title 'All Star Supplier Sync v2.0.20' \
            --notes "UX hardening release: bridge-token regeneration moved to a bottom Danger Zone with explicit acknowledgement and typed REGENERATE confirmation; new SanMar, S&S, and Momentec imports automatically select the first alphabetical real variation as WooCommerce defaults; Momentec Add Products gains a Ready to Import view for completed GitHub hydration and queue actions preserve catalog context. SHA-256: ${SHA}"
          echo "SHA256=${SHA}"

      - name: Remove temporary release tooling
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd rel
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/build-v2.0.20.yml .release-tools/patch-v2.0.20.py
          rmdir .release-tools 2>/dev/null || true
          git commit -m 'cleanup: remove v2.0.20 release tooling'
          git push origin main
