name: Build Supplier Sync v2.0.20

on:
  push:
    paths:
      - '.github/workflows/build-v2.0.20.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: recovery/v2.0.19-exact-source
          path: src
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: main
          path: rel
          fetch-depth: 0

      - name: Patch exact source
        shell: bash
        run: |
          set -euo pipefail
          git -C rel show 54c3a38b4a9950df5780808daed981d7384d1af0:.release-tools/patch-v2.0.20.py > /tmp/patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/patch.py'); s=p.read_text()
          start=s.index('# Remove regeneration button from the normal GitHub Bridge row')
          end=s.index('# Add the Danger Zone at the absolute bottom of Settings')
          fixed="""# Remove the unique legacy regeneration button without depending on PHP string escaping.\nneedle = 'Generate New Token</button>'\npos = admin.find(needle)\nif pos < 0: raise SystemExit('remove inline regen button: visible button text not found')\nbutton_start = admin.rfind('<button', 0, pos)\nif button_start < 0: raise SystemExit('remove inline regen button: opening button tag not found')\nadmin = admin[:button_start] + admin[pos + len(needle):]\n\n"""
          p.write_text(s[:start]+fixed+s[end:])
          PY
          python3 /tmp/patch.py

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          find src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          cat /tmp/php-lint.txt
          python3 - <<'PY'
          from pathlib import Path
          admin=Path('src/includes/class-asss-admin.php').read_text(); imp=Path('src/includes/class-asss-importer.php').read_text(); mom=Path('src/includes/class-asss-momentec.php').read_text(); main=Path('src/all-star-supplier-sync.php').read_text(); readme=Path('src/readme.txt').read_text()
          required=['Danger Zone',"$phrase !== 'REGENERATE'",'asss_regen_ack','Ready to Import','return_momentec_view',"$view==='ready' && !isset($hydrated[$key])",'set_new_product_alphabetical_defaults',"define('ASSS_VERSION', '2.0.20');",'Stable tag: 2.0.20']
          missing=[x for x in required if x not in '\n'.join([admin,imp,mom,main,readme])]
          if missing: raise SystemExit('Missing invariants: '+repr(missing))
          if 'Generate New Token</button>' in admin: raise SystemExit('Old inline token button still exists')
          if admin.count('Generate New Bridge Token') != 1: raise SystemExit('Danger Zone token button count is not 1')
          if imp.count('set_new_product_alphabetical_defaults($product_id)') < 3: raise SystemExit('Defaults not wired to all supplier imports')
          print('v2.0.20 validation passed')
          PY

      - name: Save exact source branch
        shell: bash
        run: |
          set -euo pipefail
          cd src
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C recovery/v2.0.20-exact-source
          git add -A && git commit -m 'release: exact v2.0.20 plugin source'
          git push --force-with-lease origin HEAD:refs/heads/recovery/v2.0.20-exact-source

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' src/ package/all-star-supplier-sync/
          rm -rf package/all-star-supplier-sync/.github package/all-star-supplier-sync/.release-tools
          (cd package && zip -qr ../rel/all-star-supplier-sync-2.0.20.zip all-star-supplier-sync)
          unzip -t rel/all-star-supplier-sync-2.0.20.zip >/dev/null
          SHA=$(sha256sum rel/all-star-supplier-sync-2.0.20.zip | awk '{print $1}')
          cat > rel/latest.json <<EOF
          {
            "version": "2.0.20",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.20/all-star-supplier-sync-2.0.20.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.20",
            "name": "All Star Supplier Sync v2.0.20"
          }
          EOF
          cd rel
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-supplier-sync-2.0.20.zip latest.json && git commit -m 'release: publish Supplier Sync v2.0.20' && git push origin main
          gh release create v2.0.20 all-star-supplier-sync-2.0.20.zip --target main --title 'All Star Supplier Sync v2.0.20' --notes "Safer Bridge Token Danger Zone; alphabetical valid variation defaults for new SanMar/S&S/Momentec imports; Momentec Ready to Import view for completed GitHub hydration; queue actions preserve catalog context. SHA-256: ${SHA}"
          echo "SHA256=${SHA}"

      - name: Cleanup build workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd rel
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/build-v2.0.20.yml
          git commit -m 'cleanup: remove v2.0.20 build workflow'
          git push origin main
