name: Build Supplier Sync v2.0.12 Momentec Fast Imports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v2.0.12-momentec-fast-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: release

      - name: Checkout exact v2.0.11 source
        uses: actions/checkout@v6
        with:
          ref: recovery/v2.0.11-exact-source
          path: source

      - name: Apply v2.0.12 Momentec fast-import patch
        run: python3 release/release-tools/v2012_patch.py source

      - name: Validate PHP and fast-import architecture
        shell: bash
        run: |
          set -euo pipefail
          find source -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q 'Version: 2.0.12' source/all-star-supplier-sync.php
          grep -q "define('ASSS_VERSION', '2.0.12')" source/all-star-supplier-sync.php
          grep -q "asss_momentec_variation_media_job" source/includes/class-asss-importer.php
          grep -q "asss_momentec_parent_media_job" source/includes/class-asss-importer.php
          grep -q "sync_momentec_parent_featured_image" source/includes/class-asss-importer.php
          grep -q "queue_momentec_media_jobs" source/includes/class-asss-importer.php
          grep -q "Momentec product structure imported" source/includes/class-asss-admin.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/includes/class-asss-importer.php').read_text()
          start=p.index('private function sync_momentec_variation(int $product_id,array $row)')
          end=p.index('private function reconcile_momentec_variations', start)
          block=p[start:end]
          assert 'sync_momentec_variation_media(' not in block, 'Momentec variation import still downloads media synchronously'
          start=p.index('public function import_momentec_style')
          end=p.index('private function update_momentec_style', start)
          block=p[start:end]
          assert 'sync_momentec_parent_featured_image' in block
          assert 'queue_momentec_media_jobs' in block
          assert 'sync_momentec_parent_media($product_id,$data,$variants)' not in block
          assert "_asss_momentec_media_pending" in p
          print('MOMENTEC_FAST_IMPORT_ARCHITECTURE=PASS')
          PY

      - name: Validate credential boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -q 'ASSS_MOMENTEC_USERNAME\|ASSS_MOMENTEC_PASSWORD' source
          ! grep -R -q 'MOMENTEC_USERNAME\|MOMENTEC_PASSWORD' source
          ! grep -R -q 'name="momentec_username"\|name="momentec_password"\|name="momentec_api_key"' source

      - name: Build WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' source/ package/all-star-supplier-sync/
          cd package
          zip -qr ../release/all-star-supplier-sync-2.0.12.zip all-star-supplier-sync
          cd ../release
          unzip -t all-star-supplier-sync-2.0.12.zip >/dev/null
          unzip -p all-star-supplier-sync-2.0.12.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.12'
          sha256sum all-star-supplier-sync-2.0.12.zip

      - name: Prepare release metadata
        working-directory: release
        shell: bash
        run: |
          cat > latest.json <<'JSON'
          {
            "version": "2.0.12",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.12/all-star-supplier-sync-2.0.12.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.12",
            "name": "All Star Supplier Sync v2.0.12"
          }
          JSON
          cat > RELEASE-2.0.12.md <<'MD'
          # All Star Supplier Sync v2.0.12

          Momentec import reliability and media performance update.

          - Momentec product/variation structure is now created before heavy media downloads.
          - Variation galleries are processed in background Action Scheduler jobs instead of blocking the WordPress import request.
          - The parent WooCommerce product gets a featured supplier image immediately when one is available.
          - Parent gallery hydration also runs in the background after the featured image is attached.
          - Momentec media jobs are deduplicated and retry failed variation image downloads up to three times.
          - Variation audits understand background-media pending state instead of reporting expected in-progress galleries as failures.
          - Import completion notice explains that Momentec galleries may continue processing after the product editor opens.

          This prevents large Momentec styles from timing out after their first variation while retaining exact supplier variations, inventory, pricing and galleries.
          MD

      - name: Publish exact v2.0.12 source branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release source: All Star Supplier Sync v2.0.12'
          git push --force origin HEAD:recovery/v2.0.12-exact-source

      - name: Commit v2.0.12 package and metadata
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add all-star-supplier-sync-2.0.12.zip latest.json RELEASE-2.0.12.md
          git commit -m 'release: All Star Supplier Sync v2.0.12'
          git push origin main
