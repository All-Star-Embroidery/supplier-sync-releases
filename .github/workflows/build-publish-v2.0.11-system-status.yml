name: Build and Publish Supplier Sync v2.0.11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-v2.0.11-system-status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: release

      - name: Checkout exact v2.0.10 source
        uses: actions/checkout@v6
        with:
          ref: recovery/v2.0.10-exact-source
          path: source

      - name: Apply v2.0.11 all-supplier System Status patch
        run: python3 release/release-tools/v2011_patch.py source

      - name: Validate PHP and all-supplier status
        shell: bash
        run: |
          set -euo pipefail
          find source -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q 'Version: 2.0.11' source/all-star-supplier-sync.php
          grep -q "define('ASSS_VERSION', '2.0.11')" source/all-star-supplier-sync.php
          grep -q "inventory_targets_momentec" source/includes/class-asss-admin.php
          grep -q "asss_momentec_inventory_bridge_status" source/includes/class-asss-admin.php
          grep -q "Momentec catalog" source/includes/class-asss-admin.php
          grep -q "Momentec detail queue" source/includes/class-asss-admin.php
          grep -q "Momentec hourly inventory" source/includes/class-asss-admin.php
          grep -q "SanMar supplier" source/includes/class-asss-admin.php
          grep -q "S&S Activewear supplier" source/includes/class-asss-admin.php
          grep -q "Momentec supplier" source/includes/class-asss-admin.php

      - name: Validate Momentec credential boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -q 'ASSS_MOMENTEC_USERNAME\|ASSS_MOMENTEC_PASSWORD' source
          ! grep -R -q 'MOMENTEC_USERNAME\|MOMENTEC_PASSWORD' source
          ! grep -R -q 'name="momentec_username"\|name="momentec_password"\|name="momentec_api_key"' source

      - name: Build and validate WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' source/ package/all-star-supplier-sync/
          cd package
          zip -qr ../release/all-star-supplier-sync-2.0.11.zip all-star-supplier-sync
          cd ../release
          unzip -t all-star-supplier-sync-2.0.11.zip >/dev/null
          unzip -p all-star-supplier-sync-2.0.11.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.11'
          sha256sum all-star-supplier-sync-2.0.11.zip

      - name: Prepare release metadata
        working-directory: release
        shell: bash
        run: |
          cat > latest.json <<'JSON'
          {
            "version": "2.0.11",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.11/all-star-supplier-sync-2.0.11.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.11",
            "name": "All Star Supplier Sync v2.0.11"
          }
          JSON
          cat > RELEASE-2.0.11.md <<'MD'
          # All Star Supplier Sync v2.0.11

          System Status now represents the complete three-supplier production architecture.

          - Dedicated SanMar health/coverage row.
          - Dedicated S&S Activewear health/coverage row.
          - Dedicated Momentec health/coverage row.
          - Momentec official catalog style count and last catalog receipt.
          - Momentec customer-detail hydration queue state, including failed requests.
          - Momentec hourly inventory status and active target count.
          - Active linked-product summary now includes SanMar, S&S, and Momentec inventory targets.
          - Multi-supplier description updated for all three supplier sources.

          Momentec credentials remain exclusively in GitHub Actions Secrets and are never stored by WordPress.
          MD

      - name: Publish exact v2.0.11 source branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release source: All Star Supplier Sync v2.0.11'
          git push --force origin HEAD:recovery/v2.0.11-exact-source

      - name: Commit v2.0.11 package and metadata
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-supplier-sync-2.0.11.zip latest.json RELEASE-2.0.11.md
          git commit -m 'release: All Star Supplier Sync v2.0.11'
          git push origin main

      - name: Publish GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.11 >/dev/null 2>&1; then
            gh release upload v2.0.11 all-star-supplier-sync-2.0.11.zip --clobber
            gh release edit v2.0.11 --title 'All Star Supplier Sync v2.0.11' --notes-file RELEASE-2.0.11.md
          else
            gh release create v2.0.11 all-star-supplier-sync-2.0.11.zip --target main --title 'All Star Supplier Sync v2.0.11' --notes-file RELEASE-2.0.11.md
          fi
