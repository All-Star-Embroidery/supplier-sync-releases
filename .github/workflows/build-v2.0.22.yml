name: Build Supplier Sync v2.0.22

on:
  push:
    paths:
      - '.github/workflows/build-v2.0.22.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact v2.0.21 source
        uses: actions/checkout@v6
        with:
          ref: recovery/v2.0.21-exact-source
          path: source

      - name: Checkout release repository
        uses: actions/checkout@v6
        with:
          ref: main
          path: release
          fetch-depth: 0

      - name: Apply v2.0.22 patch
        run: python release/.release-staging/v2.0.22/patch.py source

      - name: Validate source
        run: |
          find source -name '*.php' -print0 | xargs -0 -n1 php -l
          python - <<'PY'
          from pathlib import Path
          s=Path('source/includes/class-asss-importer.php').read_text()
          checks=[
              'migrate_momentec_shipping_weights_v2022',
              'apply_supplier_variation_weight',
              '_asss_momentec_weight_lb',
              "'missing_weight'=>$missing_weight",
              'styles_queued_for_github',
              "'weight_lb'=>$row['weight_lb'] ?? null",
          ]
          for check in checks:
              assert check in s, check
          assert 'Version: 2.0.22' in Path('source/all-star-supplier-sync.php').read_text()
          assert 'Stable tag: 2.0.22' in Path('source/readme.txt').read_text()
          print('v2.0.22 weight invariants passed')
          PY

      - name: Save exact v2.0.22 source branch
        working-directory: release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B recovery/v2.0.22-exact-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' ../source/ ./
          git add -A
          git commit -m 'release: exact v2.0.22 source'
          git push --force origin recovery/v2.0.22-exact-source
          git checkout main

      - name: Build package
        run: |
          rm -rf package all-star-supplier-sync-2.0.22.zip
          mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' --exclude='.github' source/ package/all-star-supplier-sync/
          cd package
          zip -qr ../all-star-supplier-sync-2.0.22.zip all-star-supplier-sync

      - name: Publish release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout main
          git pull --ff-only
          SHA=$(sha256sum ../all-star-supplier-sync-2.0.22.zip | awk '{print $1}')
          cat > latest.json <<EOF
          {
            "version": "2.0.22",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.22/all-star-supplier-sync-2.0.22.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.22",
            "name": "All Star Supplier Sync v2.0.22"
          }
          EOF
          git add latest.json
          git commit -m 'release: point updater to v2.0.22'
          git push
          gh release create v2.0.22 ../all-star-supplier-sync-2.0.22.zip --title 'All Star Supplier Sync v2.0.22' --notes "Momentec shipping-weight hardening: exact Item_SKU weights from official product feed, Woo variation weight assignment, missing-weight audit, and existing-product rehydration migration. SHA-256: ${SHA}"

      - name: Cleanup temporary release tooling
        if: always()
        working-directory: release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout main
          git pull --ff-only
          git rm -f .github/workflows/build-v2.0.22.yml || true
          git rm -f .release-staging/v2.0.22/patch.py || true
          git commit -m 'maintenance: remove v2.0.22 build tooling' || true
          git push || true
