name: Package Supplier Sync v2.0.12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-v2.0.12-momentec-fast-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: release

      - name: Checkout validated v2.0.12 source
        uses: actions/checkout@v6
        with:
          ref: recovery/v2.0.12-exact-source
          path: source

      - name: Validate exact source
        shell: bash
        run: |
          set -euo pipefail
          find source -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q 'Version: 2.0.12' source/all-star-supplier-sync.php
          grep -q "queue_momentec_media_jobs" source/includes/class-asss-importer.php
          grep -q "sync_momentec_parent_featured_image" source/includes/class-asss-importer.php

      - name: Build ZIP and release metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' source/ package/all-star-supplier-sync/
          cd package
          zip -qr ../release/all-star-supplier-sync-2.0.12.zip all-star-supplier-sync
          cd ../release
          unzip -t all-star-supplier-sync-2.0.12.zip >/dev/null
          sha256sum all-star-supplier-sync-2.0.12.zip
          cat > latest.json <<'JSON'
          {
            "version": "2.0.12",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.12/all-star-supplier-sync-2.0.12.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.12",
            "name": "All Star Supplier Sync v2.0.12"
          }
          JSON
          cat > RELEASE-2.0.12.md <<'MD'
          # All Star Supplier Sync v2.0.12

          Momentec import reliability and media performance update.

          - Creates the complete selected Momentec product/variation structure before heavy image downloads.
          - Downloads only the parent featured image during the interactive import when available.
          - Processes variation galleries and the remaining parent gallery with background Action Scheduler jobs.
          - Deduplicates media jobs and retries failed variation image downloads up to three times.
          - Keeps in-progress background media from being reported as an import failure.
          - Prevents large Momentec styles from timing out after the first variation.
          MD

      - name: Commit package and metadata
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-supplier-sync-2.0.12.zip latest.json RELEASE-2.0.12.md
          git commit -m 'release: All Star Supplier Sync v2.0.12'
          git push origin main
