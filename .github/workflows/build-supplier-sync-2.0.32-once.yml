name: Build Supplier Sync v2.0.32 Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-supplier-sync-2.0.32-once.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v2.0.31
          fetch-depth: 0

      - name: Patch v2.0.32 background jobs
        run: |
          python3 - <<'PY'
          import base64,zlib
          exec(zlib.decompress(base64.b64decode("")).decode())
          PY

      - name: Validate
        run: |
          set -euo pipefail
          grep -q 'Version: 2.0.32' all-star-supplier-sync.php
          grep -q 'class ASSS_Background_Jobs' includes/class-asss-background-jobs.php
          grep -q 'as_enqueue_async_action' includes/class-asss-background-jobs.php
          grep -q 'wp_ajax_asss_job_status' includes/class-asss-background-jobs.php
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Commit source and tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c supplier-sync-v2.0.32-source
          git add all-star-supplier-sync.php includes/class-asss-admin.php includes/class-asss-background-jobs.php
          git commit -m 'Supplier Sync v2.0.32: background product jobs'
          git push origin HEAD:refs/heads/supplier-sync-v2.0.32-source
          git tag -a v2.0.32 -m 'All Star Supplier Sync v2.0.32'
          git push origin refs/tags/v2.0.32

      - name: Build ZIP
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg /tmp/all-star-supplier-sync-2.0.32.zip
          mkdir -p /tmp/pkg/all-star-supplier-sync
          rsync -a ./ /tmp/pkg/all-star-supplier-sync/ --exclude='.git' --exclude='.github' --exclude='*.zip' --exclude='RELEASE-*.md' --exclude='.release-staging' --exclude='MOMENTEC-API-GROUNDWORK.md'
          (cd /tmp/pkg && zip -qr /tmp/all-star-supplier-sync-2.0.32.zip all-star-supplier-sync)
          unzip -t /tmp/all-star-supplier-sync-2.0.32.zip >/dev/null
          unzip -l /tmp/all-star-supplier-sync-2.0.32.zip | grep -q 'all-star-supplier-sync/includes/class-asss-background-jobs.php'
          sha256sum /tmp/all-star-supplier-sync-2.0.32.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >/tmp/notes <<'EOF'
          Supplier Sync v2.0.32

          Phase 1 of the background-import architecture.

          - Moves SanMar, S&S Activewear, and Momentec create/import/link operations out of the browser request and into WooCommerce Action Scheduler background jobs.
          - Quick Repair uses the same background job wrapper.
          - The browser returns immediately and securely polls real queued/running/completed/failed job state.
          - Jobs continue if the administrator leaves or closes the page.
          - Successful imports automatically open the resulting WooCommerce product.
          - Existing importer functions remain the source of truth; supplier logic is unchanged.
          - Uses WooCommerce Action Scheduler, with WP-Cron fallback.
          - Fine-grained variation/image counters are intentionally deferred to the next phase rather than showing a fake percentage.
          EOF
          gh release create v2.0.32 /tmp/all-star-supplier-sync-2.0.32.zip --title 'All Star Supplier Sync v2.0.32' --notes-file /tmp/notes
