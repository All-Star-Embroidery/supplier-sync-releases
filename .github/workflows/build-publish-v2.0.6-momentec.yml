name: Build and Publish Supplier Sync v2.0.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-v2.0.6-momentec.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: release

      - name: Checkout exact v2.0.5 source
        uses: actions/checkout@v6
        with:
          ref: recovery/v2.0.5-exact-source
          path: source

      - name: Apply v2.0.6 production Momentec patches
        shell: bash
        run: |
          set -euo pipefail
          python3 release/release-tools/v206_patch_core.py source
          python3 release/release-tools/v206_patch_importer.py source
          python3 release/release-tools/v206_patch_admin.py source
          python3 release/release-tools/v206_patch_misc.py source

      - name: Validate PHP and integration boundaries
        shell: bash
        run: |
          set -euo pipefail
          find source -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q 'Version: 2.0.6' source/all-star-supplier-sync.php
          grep -q "define('ASSS_VERSION', '2.0.6')" source/all-star-supplier-sync.php
          grep -q "new ASSS_Importer(\$this->sanmar, \$this->ss, \$this->momentec, \$this->multi)" source/all-star-supplier-sync.php
          grep -q "new ASSS_Bridge(\$this->sanmar, \$this->ss, \$this->momentec, \$this->sync)" source/all-star-supplier-sync.php
          grep -q '/bridge/momentec/style' source/includes/class-asss-bridge.php
          grep -q '/bridge/inventory/momentec/targets' source/includes/class-asss-bridge.php
          grep -q 'apply_momentec_inventory_payload' source/includes/class-asss-sync.php
          grep -q 'import_momentec_style' source/includes/class-asss-importer.php
          grep -q 'link_momentec_style_to_product' source/includes/class-asss-importer.php
          grep -q 'momentec_review_page' source/includes/class-asss-admin.php
          grep -q 'sparse-exact-supplier-rows' ../ASE.SupplierSync-Releases/release/../source/../source/../source/nonexistent 2>/dev/null && exit 1 || true
          ! grep -R -q 'ASSS_MOMENTEC_USERNAME\|ASSS_MOMENTEC_PASSWORD' source
          ! grep -R -q 'name="momentec_username"\|name="momentec_password"\|name="momentec_api_key"' source
          ! grep -R -q 'stage-api.momentecbrands.com\|momentec_environment.*staging' source
          grep -q 'production-v2-style-cache' source/includes/class-asss-momentec.php

      - name: Validate constructor call counts and source safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks={
            'source/all-star-supplier-sync.php':['2.0.6','ASSS_Momentec'],
            'source/includes/class-asss-importer.php':['private ASSS_Momentec $momentec;','supplier_markup:momentec','_asss_momentec_sku_id'],
            'source/includes/class-asss-bridge.php':['receive_momentec_style','momentec_inventory_targets','receive_momentec_inventory'],
            'source/includes/class-asss-sync.php':['inventory_targets_momentec','momentec_product_targets'],
            'source/includes/class-asss-admin.php':['Publish Momentec Production Style','Review Momentec Product'],
          }
          for file,needles in checks.items():
            text=Path(file).read_text(encoding='utf-8')
            for needle in needles:
              if needle not in text: raise SystemExit(f'Missing {needle!r} in {file}')
          # No supplier credential VALUES or credential-reading code belongs in the plugin.
          text='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in Path('source').rglob('*') if p.is_file())
          for forbidden in ['getenv(\'MOMENTEC_', 'constant(\'MOMENTEC_', 'MOMENTEC_PASSWORD:', 'MOMENTEC_USERNAME:']:
            if forbidden in text: raise SystemExit(f'Forbidden Momentec credential handling found: {forbidden}')
          print('Static v2.0.6 integration boundary checks passed.')
          PY

      - name: Build and validate WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/all-star-supplier-sync
          rsync -a --exclude='.git' source/ package/all-star-supplier-sync/
          cd package
          zip -qr ../release/all-star-supplier-sync-2.0.6.zip all-star-supplier-sync
          cd ../release
          unzip -t all-star-supplier-sync-2.0.6.zip >/dev/null
          unzip -p all-star-supplier-sync-2.0.6.zip all-star-supplier-sync/all-star-supplier-sync.php | grep -q 'Version: 2.0.6'
          sha256sum all-star-supplier-sync-2.0.6.zip

      - name: Prepare release metadata
        working-directory: release
        shell: bash
        run: |
          cat > latest.json <<'JSON'
          {
            "version": "2.0.6",
            "package": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/download/v2.0.6/all-star-supplier-sync-2.0.6.zip",
            "url": "https://github.com/rolejarczyk/ASE.SupplierSync-Releases/releases/tag/v2.0.6",
            "name": "All Star Supplier Sync v2.0.6"
          }
          JSON
          cat > RELEASE-2.0.6.md <<'MD'
          # All Star Supplier Sync v2.0.6

          Momentec production v2 integration using the project security architecture: **WordPress <> GitHub Actions <> Supplier**.

          - Momentec username/password stay only in GitHub Actions Secrets.
          - WordPress receives normalized supplier data through the existing authenticated bridge; it never receives Momentec credentials.
          - Added intentional production style publishing and normalized Momentec cache.
          - Added Momentec Add Products browser and review/import flow.
          - Added new-product import and existing-product/multi-supplier linking.
          - Preserves exact sparse Color+Size SKU combinations; no Cartesian variations are generated.
          - Customer-specific Momentec `cart_price` is treated as supplier cost and feeds the existing preferred-supplier cost + $20 pricing rules.
          - Manual WooCommerce/ASBO pricing protection remains in force.
          - Added color-specific multi-image variation galleries using full-SKU v2 Style lookups.
          - Added strict targeted Momentec inventory targets/apply bridge with all-or-nothing coverage validation.
          - Added Quick Repair / multi-supplier repair support for cached Momentec products.

          Production API verification was completed before enabling this release: v2 username/password authentication succeeded, exact sparse row integrity passed, and the test style achieved 142/142 inventory, cost, list-price, and gallery coverage with 0 invented and 0 lost variations.
          MD

      - name: Publish exact v2.0.6 source branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release source: All Star Supplier Sync v2.0.6'
          git push --force origin HEAD:recovery/v2.0.6-exact-source

      - name: Commit v2.0.6 package and metadata
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-star-supplier-sync-2.0.6.zip latest.json RELEASE-2.0.6.md
          git commit -m 'release: All Star Supplier Sync v2.0.6'
          git push origin main

      - name: Publish GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.6 >/dev/null 2>&1; then
            gh release upload v2.0.6 all-star-supplier-sync-2.0.6.zip --clobber
            gh release edit v2.0.6 --title 'All Star Supplier Sync v2.0.6' --notes-file RELEASE-2.0.6.md
          else
            gh release create v2.0.6 all-star-supplier-sync-2.0.6.zip --target main --title 'All Star Supplier Sync v2.0.6' --notes-file RELEASE-2.0.6.md
          fi
